<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catuna Pedidos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDVtOX-_9idM9YiNAem5fc1SiGZLjypJ-Y",
      authDomain: "catunapedidos.firebaseapp.com",
      projectId: "catunapedidos",
      storageBucket: "catunapedidos.appspot.com",
      messagingSenderId: "344968029861",
      appId: "1:344968029861:web:c701d3528c88aec735cf4c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function App() {
      const [currentTab, setCurrentTab] = useState('cliente');
      const APP_FEE = 300; 
      const BASE_DELIVERY_FEE = 1500; 

      // Estados de Firestore
      const [stores, setStores] = useState([]);
      const [products, setProducts] = useState([]);
      const [cadetes, setCadetes] = useState([]);
      const [orders, setOrders] = useState([]);
      const [globalAnnouncement, setGlobalAnnouncement] = useState('');

      // Cliente
      const [searchTerm, setSearchTerm] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [custCoords, setCustCoords] = useState(null);
      const [lastOrderId, setLastOrderId] = useState(null);

      // Chat en Vivo
      const [activeChatOrder, setActiveChatOrder] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [newMessageText, setNewMessageText] = useState('');
      const chatEndRef = useRef(null);

      // Comercio
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loggedStore, setLoggedStore] = useState(null);
      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [prodDesc, setProdDesc] = useState('');
      const [prodIsPromo, setProdIsPromo] = useState(false);
      const [prodPromoHours, setProdPromoHours] = useState('24');
      const [prodImg, setProdImg] = useState('');
      const [isCompressing, setIsCompressing] = useState(false);

      // Cadete
      const [loggedCadete, setLoggedCadete] = useState(null);

      // Admin
      const [adminPass, setAdminPass] = useState('');
      const [isAdminLogged, setIsAdminLogged] = useState(false);
      const [newStoreName, setNewStoreName] = useState('');
      const [newStoreAddress, setNewStoreAddress] = useState('');
      const [newStoreUser, setNewStoreUser] = useState('');
      const [newStorePass, setNewStorePass] = useState('');
      const [newCadeteName, setNewCadeteName] = useState('');
      const [newCadeteUser, setNewCadeteUser] = useState('');
      const [newCadetePass, setNewCadetePass] = useState('');
      const [selectedCadeteId, setSelectedCadeteId] = useState('');
      const [rechargeAmount, setRechargeAmount] = useState('');
      const [announcementInput, setAnnouncementInput] = useState('');

      // Sincronización en tiempo real con Firebase
      useEffect(() => {
        const unsubStores = db.collection('stores').onSnapshot(snapshot => {
          setStores(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCadetes = db.collection('cadetes').onSnapshot(snapshot => {
          setCadetes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubOrders = db.collection('orders').onSnapshot(snapshot => {
          setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubConfig = db.collection('config').doc('announcement').onSnapshot(doc => {
          if (doc.exists) setGlobalAnnouncement(doc.data().text || '');
        });

        return () => {
          unsubStores(); unsubProducts(); unsubCadetes(); unsubOrders(); unsubConfig();
        };
      }, []);

      // Chat Listener
      useEffect(() => {
        if (!activeChatOrder) return;
        const unsubChat = db.collection('orders').doc(activeChatOrder.id)
          .collection('messages').orderBy('createdAt', 'asc')
          .onSnapshot(snapshot => {
            setChatMessages(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
        return () => unsubChat();
      }, [activeChatOrder]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChatOrder) return;

        let senderRole = 'Cliente';
        let senderName = activeChatOrder.customerName || 'Cliente';

        if (currentTab === 'comercio' && loggedStore) {
          senderRole = 'Comercio';
          senderName = loggedStore.name;
        } else if (currentTab === 'cadete' && loggedCadete) {
          senderRole = 'Cadete';
          senderName = loggedCadete.name;
        }

        try {
          await db.collection('orders').doc(activeChatOrder.id).collection('messages').add({
            senderRole, senderName, text: newMessageText.trim(),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewMessageText('');
        } catch (err) { alert("Error al enviar mensaje: " + err.message); }
      };

      // GPS Cliente
      const handleGetLocationGPS = () => {
        if (!navigator.geolocation) { alert("Tu navegador no soporta geolocalización."); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            setCustCoords({ lat, lng });
            setCustAddress(`📍 GPS exacto (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
            alert("Ubicación GPS obtenida.");
          },
          () => alert("No se pudo obtener la ubicación GPS."),
          { enableHighAccuracy: true }
        );
      };

      // Carrito
      const addToCart = (product, store) => {
        const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
        if (onlineCadetesCount === 0) { alert("⚠️ No hay cadetes en línea disponibles."); return; }
        if (!store.isOpen || store.isSuspended) { alert("Este negocio se encuentra cerrado."); return; }

        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i));
        } else {
          setCart([...cart, { ...product, storeId: store.id, storeName: store.name, storeAddress: store.address, storePhone: store.phone, quantity: 1 }]);
        }
        setIsCartOpen(true);
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const uniqueStoresInCart = [...new Set(cart.map(i => i.storeId))].length;
      const calculatedDeliveryFee = BASE_DELIVERY_FEE + (Math.max(0, uniqueStoresInCart - 1) * 500);

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;

        const uniqueStoresMap = {};
        cart.forEach(item => {
          if (!uniqueStoresMap[item.storeId]) {
            const storeDoc = stores.find(s => s.id === item.storeId);
            uniqueStoresMap[item.storeId] = {
              storeId: item.storeId, storeName: item.storeName, storeAddress: item.storeAddress,
              alias: storeDoc ? storeDoc.alias : '', items: []
            };
          }
          uniqueStoresMap[item.storeId].items.push(item);
        });

        const storesList = Object.values(uniqueStoresMap);
        const storesInvolvedIds = storesList.map(s => s.storeId);

        try {
          const docRef = await db.collection('orders').add({
            storesInvolved: storesInvolvedIds, storesList, customerName: custName, customerPhone: custPhone,
            address: custAddress, coords: custCoords || null, paymentMethod: 'Efectivo', items: cart,
            deliveryFee: calculatedDeliveryFee, subtotal: cartSubtotal, total: cartSubtotal + calculatedDeliveryFee,
            status: 'pendiente', cadeteId: null, storeSettled: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          setLastOrderId(docRef.id);
          setCart([]); setIsCartOpen(false); setCustName(''); setCustPhone(''); setCustAddress(''); setCustCoords(null);
          alert("¡Pedido enviado con éxito!");
        } catch (err) { alert("Error al registrar pedido: " + err.message); }
      };

      // Comercio Logica
      const handleStoreLogin = (e) => {
        e.preventDefault();
        const found = stores.find(s => s.user === loginUser && s.pass === loginPass);
        if (found) {
          if (found.isSuspended) { alert("⚠️ Tu comercio está suspendido."); return; }
          setLoggedStore(found);
        } else { alert("Usuario o contraseña incorrectos"); }
      };

      const toggleStoreOpenStatus = async () => {
        if (!loggedStore) return;
        const updatedStatus = !loggedStore.isOpen;
        try {
          await db.collection('stores').doc(loggedStore.id).update({ isOpen: updatedStatus });
          setLoggedStore({ ...loggedStore, isOpen: updatedStatus });
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const MAX_HEIGHT = 500;
            let width = img.width, height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setProdImg(canvas.toDataURL('image/jpeg', 0.7));
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!loggedStore || isCompressing) return;
        let promoExpiresAt = prodIsPromo ? Date.now() + ((Number(prodPromoHours) || 24) * 3600000) : null;
        try {
          await db.collection('products').add({
            storeId: loggedStore.id, name: prodName, price: Number(prodPrice) || 0,
            isPromo: prodIsPromo, promoExpiresAt, description: prodDesc,
            image: prodImg || 'https://via.placeholder.com/150',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setProdName(''); setProdPrice(''); setProdDesc(''); setProdIsPromo(false); setProdPromoHours('24'); setProdImg('');
          alert("Producto / Oferta guardada con éxito.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleDeleteProduct = async (id, name) => {
        if (confirm(`¿Eliminar "${name}" del catálogo?`)) {
          try { await db.collection('products').doc(id).delete(); alert("Producto eliminado."); } 
          catch (err) { alert("Error: " + err.message); }
        }
      };

      // Cadete Logica
      const handleCadeteLogin = (e) => {
        e.preventDefault();
        const found = cadetes.find(c => c.user === loginUser && c.pass === loginPass);
        if (found) {
          if (found.isSuspended) { alert("⚠️ Tu cuenta está suspendida."); return; }
          setLoggedCadete(found);
        } else { alert("Usuario o contraseña incorrectos"); }
      };

      const toggleCadeteOnlineStatus = async () => {
        if (!loggedCadete) return;
        const updatedStatus = !loggedCadete.isOnline;
        try {
          await db.collection('cadetes').doc(loggedCadete.id).update({ isOnline: updatedStatus });
          setLoggedCadete({ ...loggedCadete, isOnline: updatedStatus });
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleAcceptOrder = async (orderId) => {
        if (!loggedCadete || !loggedCadete.isOnline) { alert("Debes estar en línea."); return; }
        if ((Number(loggedCadete.balance) || 0) < APP_FEE) { alert(`Saldo insuficiente (Mínimo $${APP_FEE}).`); return; }
        try {
          const newBalance = (Number(loggedCadete.balance) || 0) - APP_FEE;
          await db.collection('cadetes').doc(loggedCadete.id).update({ balance: newBalance });
          await db.collection('orders').doc(orderId).update({ status: 'tomado_por_cadete', cadeteId: loggedCadete.id });
          setLoggedCadete({ ...loggedCadete, balance: newBalance });
          alert("¡Envío aceptado!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleMarkAsOnTheWay = async (orderId) => {
        try { await db.collection('orders').doc(orderId).update({ status: 'en_camino' }); alert("Pedido en camino."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleCompleteOrder = async (orderId) => {
        try { await db.collection('orders').doc(orderId).update({ status: 'entregado' }); alert("¡Pedido entregado!"); } 
        catch (err) { alert("Error: " + err.message); }
      };

      // Admin Logica
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'Aithana2411') setIsAdminLogged(true);
        else alert("Contraseña de Admin incorrecta");
      };

      const handleCreateStore = async (e) => {
        e.preventDefault();
        try {
          await db.collection('stores').add({
            name: newStoreName, address: newStoreAddress, phone: 'Sin Teléfono', alias: 'Sin Alias', titular: 'Sin Titular',
            hours: '08:00 a 23:00 hs', isOpen: true, isSuspended: false, user: newStoreUser, pass: newStorePass,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewStoreName(''); setNewStoreAddress(''); setNewStoreUser(''); setNewStorePass('');
          alert("¡Comercio creado con éxito desde tu panel!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleCreateCadete = async (e) => {
        e.preventDefault();
        try {
          await db.collection('cadetes').add({
            name: newCadeteName, phone: 'Sin Teléfono', vehicle: 'Moto', user: newCadeteUser, pass: newCadetePass,
            balance: 0, isOnline: true, isSuspended: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewCadeteName(''); setNewCadeteUser(''); setNewCadetePass('');
          alert("¡Cadete creado con éxito desde tu panel!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleRechargeBalance = async (e) => {
        e.preventDefault();
        const amount = Number(rechargeAmount);
        if (!selectedCadeteId || amount <= 0) return;
        const cadeteDoc = cadetes.find(c => c.id === selectedCadeteId);
        if (!cadeteDoc) return;
        try {
          await db.collection('cadetes').doc(selectedCadeteId).update({ balance: (Number(cadeteDoc.balance) || 0) + amount });
          setRechargeAmount('');
          alert("¡Saldo acreditado al cadete correctamente!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handlePublishAnnouncement = async (e) => {
        e.preventDefault();
        try {
          await db.collection('config').doc('announcement').set({ text: announcementInput });
          setAnnouncementInput(''); alert("Anuncio publicado.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleClearAnnouncement = async () => {
        try { await db.collection('config').doc('announcement').set({ text: '' }); alert("Anuncio eliminado."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const filteredStores = stores.filter(store => {
        if (store.isSuspended) return false;
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;
        const matchesStore = store.name.toLowerCase().includes(query) || (store.address && store.address.toLowerCase().includes(query));
        const storeProds = products.filter(p => p.storeId === store.id);
        const matchesProduct = storeProds.some(p => p.name.toLowerCase().includes(query));
        return matchesStore || matchesProduct;
      });

      const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
      const activeLiveOrder = orders.find(o => o.id === lastOrderId);

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl relative pb-24">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-45 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Ecosistema Completo de 4 Pilares</p>
            </div>
            <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
          </header>

          {globalAnnouncement && currentTab === 'cliente' && (
            <div className="bg-amber-500 text-amber-950 font-bold px-4 py-2 text-xs text-center border-b border-amber-600">
              <span>📢 {globalAnnouncement}</span>
            </div>
          )}

          {/* Menú de Navegación de Pilares */}
          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          <main className="flex-1 p-4 overflow-y-auto">
            {/* PILAR 1: CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-4">
                {activeLiveOrder && activeLiveOrder.status !== 'entregado' && (
                  <div className="p-3 bg-orange-50 border-2 border-orange-400 rounded-lg text-center space-y-2">
                    <p className="font-bold text-xs text-orange-900">Estado de tu pedido: <span className="uppercase text-red-600">{activeLiveOrder.status}</span></p>
                    <button onClick={() => setActiveChatOrder(activeLiveOrder)} className="w-full bg-indigo-600 text-white py-1.5 rounded font-bold text-xs">
                      💬 Abrir Chat del Pedido (En Vivo)
                    </button>
                  </div>
                )}

                <div className={`p-2.5 rounded-lg border text-center text-xs font-bold ${onlineCadetesCount > 0 ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800'}`}>
                  {onlineCadetesCount > 0 ? `🛵 ¡Hay ${onlineCadetesCount} cadete(s) en línea!` : '⚠️ No hay cadetes activos.'}
                </div>

                <input 
                  type="text"
                  placeholder="🔍 Buscar comercio o producto..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full text-xs p-2.5 border-2 border-red-200 rounded-lg bg-gray-50 focus:outline-none focus:border-red-600"
                />

                {filteredStores.map(store => (
                  <div key={store.id} className="border rounded-lg p-3 bg-gray-50 shadow-sm space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="font-bold text-gray-800 text-base">{store.name}</h3>
                        <p className="text-xs text-gray-500">{store.address}</p>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-1 rounded ${store.isOpen ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                        {store.isOpen ? '🟢 ABIERTO' : '🔴 CERRADO'}
                      </span>
                    </div>

                    <div className="space-y-2">
                      {products.filter(p => p.storeId === store.id).map(prod => (
                        <div key={prod.id} className="flex gap-3 bg-white p-2 rounded border items-center">
                          <img src={prod.image} className="w-14 h-14 object-cover rounded bg-gray-200" alt={prod.name} />
                          <div className="flex-1">
                            <div className="flex items-center gap-1">
                              <p className="font-bold text-sm text-gray-800">{prod.name}</p>
                              {prod.isPromo && <span className="bg-amber-500 text-white text-[9px] px-1 rounded font-extrabold">OFERTA</span>}
                            </div>
                            <p className="text-xs text-gray-500">{prod.description}</p>
                            <p className="text-xs font-bold text-red-600">${prod.price}</p>
                          </div>
                          <button 
                            onClick={() => addToCart(prod, store)} 
                            disabled={!store.isOpen || onlineCadetesCount === 0}
                            className="text-xs px-2.5 py-1.5 rounded font-bold bg-red-600 text-white shadow disabled:bg-gray-300">
                            + Pedir
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}

                {cart.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-900 text-white p-3 shadow-2xl z-40 flex justify-between items-center border-t-2 border-red-500">
                    <div>
                      <p className="text-xs font-bold">Subtotal: ${Math.round(cartSubtotal)}</p>
                    </div>
                    <button onClick={() => setIsCartOpen(true)} className="bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-xs shadow">
                      Ver Carrito ➔
                    </button>
                  </div>
                )}

                {isCartOpen && (
                  <div className="fixed inset-0 bg-black/60 z-50 flex flex-col justify-end max-w-md mx-auto">
                    <div className="bg-white rounded-t-2xl p-4 space-y-3 max-h-[85vh] overflow-y-auto shadow-2xl">
                      <div className="flex justify-between items-center border-b pb-2">
                        <h3 className="font-extrabold text-sm text-gray-900">🛒 Carrito de Compras</h3>
                        <button onClick={() => setIsCartOpen(false)} className="text-gray-400 font-bold text-sm">✕</button>
                      </div>

                      <div className="space-y-2">
                        {cart.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center bg-gray-50 p-2 rounded text-xs">
                            <span className="font-bold">{item.name} (x{item.quantity})</span>
                            <span className="font-extrabold text-red-600">${Math.round(item.price * item.quantity)}</span>
                          </div>
                        ))}
                      </div>

                      <form onSubmit={handleCreateOrder} className="space-y-2 pt-2">
                        <input required placeholder="Tu Nombre Completo" value={custName} onChange={e=>setCustName(e.target.value)} className="w-full text-xs p-2 border rounded" />
                        <input required placeholder="Teléfono de Contacto" value={custPhone} onChange={e=>setCustPhone(e.target.value)} className="w-full text-xs p-2 border rounded" />
                        <div className="flex gap-2">
                          <input required placeholder="Dirección exacta" value={custAddress} onChange={e=>setCustAddress(e.target.value)} className="flex-1 text-xs p-2 border rounded" />
                          <button type="button" onClick={handleGetLocationGPS} className="bg-blue-600 text-white font-bold px-2.5 py-1 rounded text-[10px]">📍 GPS</button>
                        </div>
                        <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold text-xs shadow">
                          Confirmar Pedido 🚀
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* PILAR 2: COMERCIO */}
            {currentTab === 'comercio' && (
              <div className="space-y-4 text-xs">
                {!loggedStore ? (
                  <form onSubmit={handleStoreLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Comercio</h2>
                    <p className="text-[10px] text-gray-500">Ingresa con el usuario y contraseña que creaste desde el Panel de Admin.</p>
                    <input required placeholder="Usuario" value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="w-full p-2 border rounded" />
                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-gray-100 p-3 rounded border">
                      <div>
                        <span className="font-bold text-gray-800 text-sm">{loggedStore.name}</span>
                        <p className="text-[10px] text-gray-500">Estado: <strong className={loggedStore.isOpen ? 'text-green-600':'text-red-600'}>{loggedStore.isOpen ? 'ABIERTO' : 'CERRADO'}</strong></p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={toggleStoreOpenStatus} className={`px-2.5 py-1.5 rounded font-bold text-white shadow ${loggedStore.isOpen ? 'bg-red-600' : 'bg-green-600'}`}>
                          {loggedStore.isOpen ? 'Cerrar' : 'Abrir'}
                        </button>
                        <button onClick={() => setLoggedStore(null)} className="bg-gray-700 text-white px-2 py-1 rounded font-bold">Salir</button>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <h3 className="font-bold text-gray-800">Pedidos Activos:</h3>
                      {orders.filter(o => (o.storeId === loggedStore.id || (o.storesInvolved && o.storesInvolved.includes(loggedStore.id))) && o.status !== 'entregado').map(o => (
                        <div key={o.id} className="border p-3 rounded-lg bg-white shadow-sm space-y-2">
                          <div className="flex justify-between font-bold">
                            <span>Pedido #{o.id.slice(-4).toUpperCase()}</span>
                            <span className="text-red-600">${Math.round(o.total)}</span>
                          </div>
                          <p>Cliente: {o.customerName}</p>
                          <button onClick={() => setActiveChatOrder(o)} className="w-full bg-indigo-600 text-white py-1.5 rounded font-bold flex items-center justify-center gap-1">
                            💬 Abrir Chat del Pedido
                          </button>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleAddProduct} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800 text-sm">➕ Cargar Producto / Oferta</h3>
                      <input required placeholder="Nombre del Producto" value={prodName} onChange={e=>setProdName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="number" placeholder="Precio ($)" value={prodPrice} onChange={e=>setProdPrice(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="Descripción corta" value={prodDesc} onChange={e=>setProdDesc(e.target.value)} className="w-full p-2 border rounded" />

                      <div className="bg-amber-50 p-2.5 rounded border border-amber-200 space-y-2">
                        <label className="flex items-center gap-2 font-bold text-amber-900 cursor-pointer">
                          <input type="checkbox" checked={prodIsPromo} onChange={e=>setProdIsPromo(e.target.checked)} className="w-4 h-4" />
                          <span>¿Es Oferta / Promoción Especial?</span>
                        </label>
                        {prodIsPromo && (
                          <div>
                            <p className="text-[10px] text-amber-800 font-bold">Duración:</p>
                            <select value={prodPromoHours} onChange={e=>setProdPromoHours(e.target.value)} className="w-full p-1.5 border rounded bg-white font-bold">
                              <option value="6">6 Horas</option>
                              <option value="24">24 Horas</option>
                              <option value="48">48 Horas</option>
                            </select>
                          </div>
                        )}
                      </div>

                      <div>
                        <p className="text-[10px] font-bold text-gray-600">Foto:</p>
                        <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-xs" />
                      </div>

                      <button type="submit" disabled={isCompressing} className="w-full bg-green-600 text-white py-2 rounded font-bold shadow">
                        {isCompressing ? 'Procesando...' : 'Guardar Producto'}
                      </button>
                    </form>

                    <div className="space-y-2 pt-2">
                      <h3 className="font-bold text-gray-800">Mi Catálogo:</h3>
                      {products.filter(p => p.storeId === loggedStore.id).map(p => (
                        <div key={p.id} className="flex justify-between items-center bg-white p-2 rounded border">
                          <div>
                            <p className="font-bold">{p.name} {p.isPromo && <span className="text-[9px] bg-amber-500 text-white px-1 rounded">OFERTA</span>}</p>
                            <p className="text-gray-500">${p.price}</p>
                          </div>
                          <button onClick={() => handleDeleteProduct(p.id, p.name)} className="bg-red-500 text-white px-2 py-1 rounded font-bold text-[10px]">Borrar</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* PILAR 3: CADETE */}
            {currentTab === 'cadete' && (
              <div className="space-y-4 text-xs">
                {!loggedCadete ? (
                  <form onSubmit={handleCadeteLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Repartidor (Cadete)</h2>
                    <p className="text-[10px] text-gray-500">Ingresa con las credenciales creadas desde el Panel de Admin.</p>
                    <input required placeholder="Usuario" value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="w-full p-2 border rounded" />
                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="bg-gray-800 text-white p-3 rounded flex justify-between items-center">
                      <span className="font-bold">{loggedCadete.name}</span>
                      <span className="text-green-400 font-bold">Saldo: ${loggedCadete.balance || 0}</span>
                    </div>

                    <div className="border p-3 rounded bg-gray-50 flex justify-between items-center">
                      <span>Estado:</span>
                      <button onClick={toggleCadeteOnlineStatus} className={`px-3 py-1 rounded text-white font-bold ${loggedCadete.isOnline ? 'bg-green-600' : 'bg-red-600'}`}>
                        {loggedCadete.isOnline ? '🟢 EN LÍNEA' : '🔴 DESCONECTADO'}
                      </button>
                    </div>

                    <div className="space-y-2">
                      <h3 className="font-bold text-gray-800">Envíos Disponibles:</h3>
                      {orders.filter(o => o.status === 'pendiente' || (o.cadeteId === loggedCadete.id && o.status !== 'entregado')).map(o => (
                        <div key={o.id} className="border-2 border-blue-200 p-3 rounded-lg bg-gray-50 space-y-2">
                          <div className="flex justify-between font-bold">
                            <span>📦 Pedido #{o.id.slice(-4).toUpperCase()}</span>
                            <span className="text-green-700">Envío: ${Math.round(o.deliveryFee || BASE_DELIVERY_FEE)}</span>
                          </div>
                          <p>Cliente: {o.customerName} ({o.address})</p>
                          
                          <button onClick={() => setActiveChatOrder(o)} className="w-full bg-indigo-600 text-white py-1.5 rounded font-bold flex items-center justify-center gap-1">
                            💬 Chat en Vivo del Pedido
                          </button>

                          {o.status === 'pendiente' && (
                            <button onClick={()=>handleAcceptOrder(o.id)} className="w-full bg-green-700 text-white py-2 rounded font-bold">
                              Aceptar Envío (-${APP_FEE})
                            </button>
                          )}
                          {o.status === 'tomado_por_cadete' && (
                            <button onClick={()=>handleMarkAsOnTheWay(o.id)} className="w-full bg-green-600 text-white py-2 rounded font-bold">
                              En Camino 🛵
                            </button>
                          )}
                          {o.status === 'en_camino' && (
                            <button onClick={()=>handleCompleteOrder(o.id)} className="w-full bg-orange-500 text-white py-2 rounded font-bold">
                              Marcar Entregado ✅
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* PILAR 4: ADMIN */}
            {currentTab === 'admin' && (
              <div className="space-y-4 text-xs">
                {!isAdminLogged ? (
                  <form onSubmit={handleAdminLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Panel de Administración Central</h2>
                    <input required type="password" placeholder="Contraseña de Administrador" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-gray-800 text-white p-2 rounded">
                      <span className="font-bold">Panel de Control General</span>
                      <button onClick={()=>setIsAdminLogged(false)} className="text-red-300 font-bold underline">Salir</button>
                    </div>

                    {/* Crear Comercio y Contraseña */}
                    <form onSubmit={handleCreateStore} className="border p-3 rounded bg-red-50 space-y-2">
                      <h3 className="font-bold text-red-900 text-sm">🏪 Crear Comercio (Usuario y Clave)</h3>
                      <input required placeholder="Nombre del Negocio" value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input required placeholder="Dirección" value={newStoreAddress} onChange={e=>setNewStoreAddress(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input required placeholder="Usuario para el Comercio" value={newStoreUser} onChange={e=>setNewStoreUser(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input required type="password" placeholder="Contraseña" value={newStorePass} onChange={e=>setNewStorePass(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Registrar Comercio</button>
                    </form>

                    {/* Crear Cadete y Contraseña */}
                    <form onSubmit={handleCreateCadete} className="border p-3 rounded bg-blue-50 space-y-2">
                      <h3 className="font-bold text-blue-900 text-sm">🛵 Crear Cadete (Usuario y Clave)</h3>
                      <input required placeholder="Nombre del Repartidor" value={newCadeteName} onChange={e=>setNewCadeteName(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input required placeholder="Usuario para el Cadete" value={newCadeteUser} onChange={e=>setNewCadeteUser(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input required type="password" placeholder="Contraseña" value={newCadetePass} onChange={e=>setNewCadetePass(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">Registrar Cadete</button>
                    </form>

                    {/* Recargar Saldo */}
                    <div className="border p-3 rounded bg-blue-50 border-blue-200 space-y-3">
                      <h3 className="font-bold text-blue-900 text-sm">💰 Cargar Saldo a Cadete</h3>
                      <form onSubmit={handleRechargeBalance} className="space-y-2">
                        <select required value={selectedCadeteId} onChange={(e)=>setSelectedCadeteId(e.target.value)} className="w-full p-2 border rounded bg-white text-xs font-bold">
                          <option value="">Seleccionar Repartidor...</option>
                          {cadetes.map(c => (
                            <option key={c.id} value={c.id}>{c.name} (Saldo: ${c.balance || 0})</option>
                          ))}
                        </select>
                        <input required type="number" placeholder="Monto a acreditar ($)" value={rechargeAmount} onChange={(e)=>setRechargeAmount(e.target.value)} className="w-full p-2 border rounded bg-white" />
                        <button type="submit" className="w-full bg-blue-600 text-white py-1.5 rounded font-bold shadow">Acreditar Saldo ➕</button>
                      </form>
                    </div>

                    {/* Anuncio Global */}
                    <form onSubmit={handlePublishAnnouncement} className="border p-3 rounded bg-amber-50 space-y-2">
                      <h3 className="font-bold text-amber-900 text-sm">📢 Anuncio Global</h3>
                      <input placeholder="Mensaje para los clientes..." value={announcementInput} onChange={e=>setAnnouncementInput(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <div className="flex gap-2">
                        <button type="submit" className="flex-1 bg-amber-600 text-white py-1.5 rounded font-bold">Publicar</button>
                        {globalAnnouncement && <button type="button" onClick={handleClearAnnouncement} className="bg-red-600 text-white px-3 py-1.5 rounded font-bold">Borrar</button>}
                      </div>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* MODAL DE CHAT EN VIVO */}
            {activeChatOrder && (
              <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-3 max-w-md mx-auto">
                <div className="bg-white rounded-xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                  <div className="bg-indigo-700 text-white p-3 flex justify-between items-center">
                    <div>
                      <h3 className="font-extrabold text-sm">💬 Chat Pedido #{activeChatOrder.id.slice(-4).toUpperCase()}</h3>
                      <p className="text-[10px] text-indigo-200">Comunicación en tiempo real</p>
                    </div>
                    <button onClick={() => setActiveChatOrder(null)} className="text-white font-extrabold text-sm bg-indigo-900 px-2.5 py-1 rounded">✕</button>
                  </div>

                  <div className="flex-1 p-3 overflow-y-auto space-y-2 bg-gray-50 text-xs">
                    {chatMessages.length === 0 ? (
                      <p className="text-center text-gray-400 italic py-10">Escribe el primer mensaje...</p>
                    ) : (
                      chatMessages.map(msg => (
                        <div key={msg.id} className={`p-2 rounded-lg max-w-[80%] ${msg.senderRole === 'Cliente' ? 'bg-blue-100 text-blue-950 ml-auto' : msg.senderRole === 'Comercio' ? 'bg-red-100 text-red-950' : 'bg-green-100 text-green-950'}`}>
                          <p className="font-extrabold text-[10px] opacity-75">{msg.senderName} ({msg.senderRole})</p>
                          <p className="text-xs font-semibold mt-0.5">{msg.text}</p>
                        </div>
                      ))
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  <form onSubmit={sendMessage} className="p-2 border-t flex gap-2 bg-white">
                    <input 
                      type="text" 
                      placeholder="Escribe un mensaje..." 
                      value={newMessageText} 
                      onChange={e=>setNewMessageText(e.target.value)} 
                      className="flex-1 p-2 text-xs border rounded focus:outline-none focus:border-indigo-600"
                    />
                    <button type="submit" className="bg-indigo-600 text-white font-extrabold px-4 py-2 rounded text-xs">Enviar</button>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
