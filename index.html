<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Catuna</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDVtOX-_9idM9YiNAem5fc1SiGZLjypJ-Y",
      authDomain: "catunapedidos.firebaseapp.com",
      projectId: "catunapedidos",
      storageBucket: "catunapedidos.appspot.com",
      messagingSenderId: "344968029861",
      appId: "1:344968029861:web:c701d3528c88aec735cf4c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function App() {
      const [currentTab, setCurrentTab] = useState('cliente');

      const ADMIN_PAYMENT_INFO = {
        alias: "Juliomaldonado132",
        titular: "Julio Nicolás Maldonado",
        banco: "Mercado Pago"
      };

      const STORE_COMMISSION_PERCENT = 0.10; 
      const APP_FEE = 300; 
      const DELIVERY_FEE = 1500; 

      const [stores, setStores] = useState([]);
      const [products, setProducts] = useState([]);
      const [cadetes, setCadetes] = useState([]);
      const [orders, setOrders] = useState([]);

      const [searchTerm, setSearchTerm] = useState('');
      const [orderPrepTimes, setOrderPrepTimes] = useState({});

      useEffect(() => {
        const unsubStores = db.collection('stores').onSnapshot(snapshot => {
          setStores(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCadetes = db.collection('cadetes').onSnapshot(snapshot => {
          setCadetes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubOrders = db.collection('orders').onSnapshot(snapshot => {
          setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        return () => {
          unsubStores();
          unsubProducts();
          unsubCadetes();
          unsubOrders();
        };
      }, []);

      useEffect(() => {
        const interval = setInterval(async () => {
          const now = Date.now();
          for (const order of orders) {
            if (order.status === 'pendiente' && order.createdAt) {
              const orderTime = order.createdAt.toMillis ? order.createdAt.toMillis() : order.createdAt.seconds * 1000;
              const diffMinutes = (now - orderTime) / (1000 * 60);
              
              if (diffMinutes > 10) {
                try {
                  await db.collection('orders').doc(order.id).update({ status: 'cancelado_por_tiempo' });
                } catch (err) {
                  console.error("Error al expirar pedido automático:", err);
                }
              }
            }
          }
        }, 30000);

        return () => clearInterval(interval);
      }, [orders]);

      const [adminPass, setAdminPass] = useState('');
      const [isAdminLogged, setIsAdminLogged] = useState(false);
      
      const [newStoreName, setNewStoreName] = useState('');
      const [newStoreAddress, setNewStoreAddress] = useState('');
      const [newStorePhone, setNewStorePhone] = useState('');
      const [newStoreAlias, setNewStoreAlias] = useState('');
      const [newStoreTitular, setNewStoreTitular] = useState('');
      const [newStoreHours, setNewStoreHours] = useState('08:00 a 23:00 hs');
      const [newStoreUser, setNewStoreUser] = useState('');
      const [newStorePass, setNewStorePass] = useState('');

      const [newCadeteName, setNewCadeteName] = useState('');
      const [newCadetePhone, setNewCadetePhone] = useState('');
      const [newCadeteUser, setNewCadeteUser] = useState('');
      const [newCadetePass, setNewCadetePass] = useState('');
      const [newCadeteVehicle, setNewCadeteVehicle] = useState('Moto');

      const [selectedCadeteId, setSelectedCadeteId] = useState('');
      const [rechargeAmount, setRechargeAmount] = useState('');

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loggedStore, setLoggedStore] = useState(null);
      const [loggedCadete, setLoggedCadete] = useState(null);

      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [prodUnit, setProdUnit] = useState('Unidad');
      const [prodCategory, setProdCategory] = useState('General');
      const [prodDesc, setProdDesc] = useState('');
      const [prodImg, setProdImg] = useState('');
      const [isCompressing, setIsCompressing] = useState(false);

      const [selectedQtyMap, setSelectedQtyMap] = useState({});

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const MAX_HEIGHT = 500;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            setProdImg(compressedBase64);
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const [cart, setCart] = useState([]);
      const [selectedStore, setSelectedStore] = useState(null);
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [lastOrderSent, setLastOrderSent] = useState(null);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'Aithana2411') setIsAdminLogged(true);
        else alert("Contraseña de Admin incorrecta");
      };

      const handleCreateStore = async (e) => {
        e.preventDefault();
        try {
          await db.collection('stores').add({
            name: newStoreName, 
            address: newStoreAddress, 
            phone: newStorePhone,
            alias: newStoreAlias,
            titular: newStoreTitular,
            hours: newStoreHours || '08:00 a 23:00 hs',
            isOpen: true,
            user: newStoreUser, 
            pass: newStorePass,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewStoreName(''); setNewStoreAddress(''); setNewStorePhone(''); setNewStoreAlias(''); setNewStoreTitular(''); setNewStoreHours('08:00 a 23:00 hs'); setNewStoreUser(''); setNewStorePass('');
          alert("Comercio registrado con éxito en la nube.");
        } catch (err) {
          alert("Error al registrar comercio: " + err.message);
        }
      };

      const handleDeleteStore = async (storeId, storeName) => {
        if (confirm(`¿Estás seguro de que deseas eliminar permanentemente el comercio "${storeName}"?`)) {
          try {
            await db.collection('stores').doc(storeId).delete();
            alert("Comercio eliminado con éxito.");
          } catch (err) {
            alert("Error al eliminar comercio: " + err.message);
          }
        }
      };

      const handleCreateCadete = async (e) => {
        e.preventDefault();
        try {
          await db.collection('cadetes').add({
            name: newCadeteName, 
            phone: newCadetePhone, 
            vehicle: newCadeteVehicle, 
            user: newCadeteUser, 
            pass: newCadetePass, 
            balance: 0, 
            isOnline: true,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewCadeteName(''); setNewCadetePhone(''); setNewCadeteUser(''); setNewCadetePass(''); setNewCadeteVehicle('Moto');
          alert("Cadete creado exitosamente en la nube.");
        } catch (err) {
          alert("Error al crear cadete: " + err.message);
        }
      };

      const handleDeleteCadete = async (cadeteId, cadeteName) => {
        if (confirm(`¿Estás seguro de que deseas eliminar al cadete / repartidor "${cadeteName}"?`)) {
          try {
            await db.collection('cadetes').doc(cadeteId).delete();
            alert("Cadete eliminado con éxito.");
          } catch (err) {
            alert("Error al eliminar cadete: " + err.message);
          }
        }
      };

      const handleRechargeBalance = async (e) => {
        e.preventDefault();
        const amount = Number(rechargeAmount);
        if (!selectedCadeteId || amount <= 0) return;
        
        const cadeteDoc = cadetes.find(c => c.id === selectedCadeteId);
        if (!cadeteDoc) return;

        try {
          await db.collection('cadetes').doc(selectedCadeteId).update({
            balance: (Number(cadeteDoc.balance) || 0) + amount
          });
          setRechargeAmount('');
          alert("¡Saldo acreditado correctamente en la nube!");
        } catch (err) {
          alert("Error al recargar saldo: " + err.message);
        }
      };

      const handleResetStoreCommission = async (storeId) => {
        if (confirm("¿Confirmas que abonaste la comisión acumulada? Esto pondrá tu saldo deudor en $0.")) {
          try {
            const batch = db.batch();
            const storeOrders = orders.filter(o => o.storeId === storeId && o.status === 'entregado' && !o.storeSettled);
            storeOrders.forEach(o => {
              const ref = db.collection('orders').doc(o.id);
              batch.update(ref, { storeSettled: true });
            });
            await batch.commit();
            alert("¡Comisión rendida con éxito! Tu saldo queda saldado.");
          } catch (err) {
            alert("Error al saldar cuentas: " + err.message);
          }
        }
      };

      const handleStoreLogin = (e) => {
        e.preventDefault();
        const found = stores.find(s => s.user === loginUser && s.pass === loginPass);
        if (found) setLoggedStore(found);
        else alert("Usuario o clave incorrectos");
      };

      const toggleStoreOpenStatus = async () => {
        if (!loggedStore) return;
        const updatedStatus = !loggedStore.isOpen;
        try {
          await db.collection('stores').doc(loggedStore.id).update({ isOpen: updatedStatus });
          setLoggedStore({ ...loggedStore, isOpen: updatedStatus });
        } catch (err) {
          alert("Error al actualizar estado: " + err.message);
        }
      };

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!loggedStore) return;
        if (isCompressing) {
          alert("Espera un segundo mientras se procesa la foto...");
          return;
        }
        try {
          await db.collection('products').add({
            storeId: loggedStore.id, 
            name: prodName, 
            price: Number(prodPrice) || 0, 
            unit: prodUnit || 'Unidad',
            category: prodCategory || 'General',
            description: prodDesc, 
            image: prodImg || 'https://via.placeholder.com/150',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setProdName(''); setProdPrice(''); setProdUnit('Unidad'); setProdCategory('General'); setProdDesc(''); setProdImg('');
          alert("Producto guardado con éxito en la nube.");
        } catch (err) {
          alert("Error al guardar producto: " + err.message);
        }
      };

      const handleDeleteProduct = async (id) => {
        if (confirm("¿Seguro deseas eliminar este producto?")) {
          try {
            await db.collection('products').doc(id).delete();
          } catch (err) {
            alert("Error al eliminar: " + err.message);
          }
        }
      };

      const handleCadeteLogin = (e) => {
        e.preventDefault();
        const found = cadetes.find(c => c.user === loginUser && c.pass === loginPass);
        if (found) setLoggedCadete(found);
        else alert("Usuario o clave incorrectos");
      };

      const toggleCadeteOnlineStatus = async () => {
        if (!loggedCadete) return;
        const updatedStatus = !loggedCadete.isOnline;
        try {
          await db.collection('cadetes').doc(loggedCadete.id).update({ isOnline: updatedStatus });
          setLoggedCadete({ ...loggedCadete, isOnline: updatedStatus });
        } catch (err) {
          alert("Error al actualizar estado: " + err.message);
        }
      };

      const handleAcceptOrder = async (orderId) => {
        if (!loggedCadete) return;
        if (!loggedCadete.isOnline) {
          alert("Estás desconectado. Debes ponerte en línea para aceptar envíos.");
          return;
        }
        if ((Number(loggedCadete.balance) || 0) < APP_FEE) {
          alert(`Saldo insuficiente. Necesitas al menos $${APP_FEE} para tomar un envío.`);
          return;
        }

        try {
          const newBalance = (Number(loggedCadete.balance) || 0) - APP_FEE;
          await db.collection('cadetes').doc(loggedCadete.id).update({ balance: newBalance });
          await db.collection('orders').doc(orderId).update({ status: 'en_camino', cadeteId: loggedCadete.id });
          setLoggedCadete({ ...loggedCadete, balance: newBalance });
          alert("¡Envío aceptado! Se descontaron $" + APP_FEE + " de tu saldo.");
        } catch (err) {
          alert("Error al aceptar envío: " + err.message);
        }
      };

      const handleCompleteOrder = async (orderId) => {
        try {
          await db.collection('orders').doc(orderId).update({ status: 'entregado' });
          alert("¡Pedido entregado!");
        } catch (err) {
          alert("Error al actualizar pedido: " + err.message);
        }
      };

      const handleRejectOrder = async (orderId) => {
        if (!loggedCadete) return;
        if (confirm("¿Estás seguro de que deseas rechazar este envío? Volverá a estar disponible para otro cadete y se te devolverán los $" + APP_FEE + ".")) {
          try {
            const newBalance = (Number(loggedCadete.balance) || 0) + APP_FEE;
            await db.collection('cadetes').doc(loggedCadete.id).update({ balance: newBalance });
            await db.collection('orders').doc(orderId).update({ status: 'pendiente', cadeteId: null });
            setLoggedCadete({ ...loggedCadete, balance: newBalance });
            alert("Envío rechazado y saldo devuelto correctamente.");
          } catch (err) {
            alert("Error al rechazar envío: " + err.message);
          }
        }
      };

      const handleSetPrepTime = async (orderId, customerPhone, customerName) => {
        const prepMinutes = orderPrepTimes[orderId] || "15";
        try {
          await db.collection('orders').doc(orderId).update({ prepTime: prepMinutes });
          alert(`Tiempo guardado (${prepMinutes} mins). Notifica al cliente por WhatsApp si lo deseas.`);
          
          const msg = `Hola ${customerName}! Tu pedido en Catuna Pedidos fue confirmado y estará listo / en camino en aproximadamente ${prepMinutes} minutos. ¡Gracias por tu compra!`;
          window.open(`https://wa.me/549${customerPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        } catch (err) {
          alert("Error al actualizar tiempo: " + err.message);
        }
      };

      const addToCart = (product, store) => {
        const onlineCadetesCount = cadetes.filter(c => c.isOnline).length;
        if (onlineCadetesCount === 0) {
          alert("⚠️ En este momento no hay cadetes en línea disponibles. Intenta más tarde.");
          return;
        }

        if (!store.isOpen) {
          alert("Este negocio está cerrado actualmente.");
          return;
        }
        if (selectedStore && selectedStore.id !== store.id) {
          if (!confirm("Solo puedes pedir a un negocio a la vez. ¿Deseas reiniciar el carrito?")) return;
          setCart([]);
        }

        const qtyToAdd = Number(selectedQtyMap[product.id]) || 1;
        if (qtyToAdd <= 0) {
          alert("Ingresa una cantidad válida.");
          return;
        }

        setSelectedStore(store);
        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + qtyToAdd } : i));
        } else {
          setCart([...cart, { ...product, quantity: qtyToAdd }]);
        }
      };

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        try {
          await db.collection('orders').add({
            storeId: selectedStore.id,
            storeName: selectedStore.name,
            storeAddress: selectedStore.address,
            storePhone: selectedStore.phone,
            customerName: custName,
            customerPhone: custPhone,
            address: custAddress,
            items: cart,
            deliveryFee: DELIVERY_FEE,
            subtotal,
            total: subtotal + DELIVERY_FEE,
            status: 'pendiente',
            cadeteId: null,
            storeSettled: false,
            prepTime: 'Por calcular',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          const itemsList = cart.map(i => `• ${i.quantity} ${i.unit || 'Unid.'} x ${i.name} ($${Math.round(i.price * i.quantity)})`).join('%0A');
          const msg = `🔔 *NUEVO PEDIDO - Catuna Pedidos*%0A%0A*Cliente:* ${encodeURIComponent(custName)}%0A*Tel:* ${encodeURIComponent(custPhone)}%0A*Dirección:* ${encodeURIComponent(custAddress)}%0A%0A*Productos:*%0A${itemsList}%0A%0A*Subtotal Productos:* $${Math.round(subtotal)}%0A*Envío:* $${DELIVERY_FEE}%0A*TOTAL A PAGAR:* $${Math.round(subtotal + DELIVERY_FEE)}`;
          
          if (selectedStore.phone) {
            window.open(`https://wa.me/549${selectedStore.phone}?text=${msg}`, '_blank');
          }

          setLastOrderSent({ storePhone: selectedStore.phone, storeName: selectedStore.name, total: Math.round(subtotal + DELIVERY_FEE) });
          setCart([]);
          setCustName(''); setCustPhone(''); setCustAddress('');
          alert("¡Pedido enviado con éxito! Se notificó al negocio por WhatsApp.");
        } catch (err) {
          alert("Error al enviar pedido: " + err.message);
        }
      };

      const filteredStores = stores.filter(store => {
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;

        const matchesStore = store.name.toLowerCase().includes(query) || (store.address && store.address.toLowerCase().includes(query));
        const storeProds = products.filter(p => p.storeId === store.id);
        const matchesProduct = storeProds.some(p => p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));

        return matchesStore || matchesProduct;
      });

      const onlineCadetesCount = cadetes.filter(c => c.isOnline).length;

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Delivery Local (En Vivo)</p>
            </div>
            <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
          </header>

          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          <main className="flex-1 p-4 pb-20 overflow-y-auto">

            {/* 1. VISTA CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-4">
                <div className={`p-2.5 rounded-lg border text-center text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm ${onlineCadetesCount > 0 ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800'}`}>
                  {onlineCadetesCount > 0 ? (
                    <><span>🛵</span> <span>¡Hay {onlineCadetesCount} {onlineCadetesCount === 1 ? 'cadete activo' : 'cadetes activos'} listos para repartir!</span></>
                  ) : (
                    <><span>⚠️</span> <span>No hay cadetes activos en este momento. Pedidos pausados temporalmente.</span></>
                  )}
                </div>

                {lastOrderSent && (
                  <div className="bg-green-50 border-2 border-green-500 p-3 rounded-lg text-center space-y-2 shadow-md">
                    <p className="font-bold text-green-900 text-sm">✅ ¡Pedido realizado a {lastOrderSent.storeName}!</p>
                    <p className="text-xs text-gray-600">Si pagaste por transferencia, toca el botón para enviar el comprobante directamente al WhatsApp del local.</p>
                    <a 
                      href={`https://wa.me/549${lastOrderSent.storePhone}?text=Hola,%20te%20envío%20el%20comprobante%20de%20mi%20pedido%20por%20$${lastOrderSent.total}%20en%20Catuna%20Pedidos:`}
                      target="_blank"
                      className="block w-full bg-green-600 text-white font-bold py-2 rounded text-xs shadow hover:bg-green-700">
                      💬 Enviar Comprobante por WhatsApp
                    </a>
                    <button onClick={() => setLastOrderSent(null)} className="text-[11px] text-gray-500 underline">Cerrar aviso</button>
                  </div>
                )}

                <div className="relative">
                  <input 
                    type="text"
                    placeholder="🔍 Buscar negocio o producto (ej: Kiosco, Fernet, Bife)..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full text-xs p-2.5 pl-3 pr-8 border-2 border-red-200 rounded-lg shadow-sm focus:outline-none focus:border-red-600 bg-gray-50"
                  />
                  {searchTerm && (
                    <button 
                      onClick={() => setSearchTerm('')} 
                      className="absolute right-2.5 top-2.5 text-xs text-gray-400 font-bold hover:text-gray-600">
                      ✕
                    </button>
                  )}
                </div>

                {filteredStores.length === 0 ? (
                  <div className="text-center py-10 text-gray-500">
                    <p className="font-bold text-base">No se encontraron comercios</p>
                    <p className="text-xs">Prueba buscando otro nombre o producto.</p>
                  </div>
                ) : (
                  filteredStores.map(store => {
                    const storeProducts = products.filter(p => {
                      if (p.storeId !== store.id) return false;
                      const q = searchTerm.toLowerCase().trim();
                      if (!q) return true;
                      
                      const matchesStore = store.name.toLowerCase().includes(q) || (store.address && store.address.toLowerCase().includes(q));
                      if (matchesStore) return true;

                      return p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q));
                    });

                    const categoriesMap = {};
                    storeProducts.forEach(prod => {
                      const cat = prod.category || 'General';
                      if (!categoriesMap[cat]) categoriesMap[cat] = [];
                      categoriesMap[cat].push(prod);

                              <span className="text-green-700">Ganancia Envío: $1200</span>
                            </div>
                            <p><strong>Retirar en:</strong> {o.storeAddress}</p>
                            <p><strong>Cliente:</strong> {o.customerName}</p>
                            <p><strong>Dirección:</strong> {o.address}</p>
                            
                            <div className="bg-white p-2 rounded text-[11px] border">
                              <p className="font-bold text-gray-700">Detalle a trasladar:</p>
                              {o.items && o.items.map((i, idx) => (
                                <p key={idx} className="text-gray-600">• {i.quantity} {i.unit || 'Unid.'} x {i.name}</p>
                              ))}
                            </div>

                            <p className="font-bold text-gray-900 bg-yellow-100 p-1.5 rounded">Cobrar al Cliente en mano: ${Math.round(o.total)}</p>

                            <div className="grid grid-cols-2 gap-2 pt-1">
                              <a 
                                href={`https://wa.me/549${o.customerPhone}?text=Hola%20${encodeURIComponent(o.customerName)},%20soy%20el%20cadete%20de%20Catuna%20Pedidos.%20Voy%20en%20camino%20con%20tu%20pedido.`} 
                                target="_blank" 
                                className="bg-green-600 text-white py-1.5 px-2 rounded text-center font-bold flex items-center justify-center gap-1">
                                💬 WhatsApp
                              </a>
                              <a 
                                href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address + ', Catuna, La Rioja')}`} 
                                target="_blank" 
                                className="bg-blue-600 text-white py-1.5 px-2 rounded text-center font-bold flex items-center justify-center gap-1">
                                📍 Google Maps
                              </a>
                            </div>

                            {o.status === 'pendiente' && (
                              <button onClick={()=>handleAcceptOrder(o.id)} className="w-full bg-green-700 text-white py-2 rounded font-bold shadow mt-2">
                                Aceptar Envío (-${APP_FEE} comisión app)
                              </button>
                            )}

                            {o.status === 'en_camino' && (
                              <div className="space-y-1.5 pt-2">
                                <button onClick={()=>handleCompleteOrder(o.id)} className="w-full bg-orange-500 text-white py-2 rounded font-bold">
                                  Marcar Entregado
                                </button>
                                <button onClick={()=>handleRejectOrder(o.id)} className="w-full bg-red-600 text-white py-1.5 rounded font-bold text-[11px] shadow">
                                  ❌ Rechazar / Liberar Envío (Devolver comisión)
                                </button>
                              </div>
                            )}
                          </div>
                        ))}
                      </>
                    )}

                    {/* NUEVO: HISTORIAL DIARIO DE ENVIOS DEL CADETE */}
                    <div className="border p-3 rounded bg-gray-50 space-y-2 mt-4">
                      <h3 className="font-bold text-gray-800 border-b pb-1">📜 Mi Historial de Envíos Realizados:</h3>
                      {orders.filter(o => o.cadeteId === loggedCadete.id && o.status === 'entregado').length === 0 ? (
                        <p className="text-gray-400 text-center italic py-2">No has completado entregas todavía.</p>
                      ) : (
                        orders.filter(o => o.cadeteId === loggedCadete.id && o.status === 'entregado').map(o => (
                          <div key={o.id} className="bg-white p-2.5 rounded border space-y-1">
                            <div className="flex justify-between font-bold text-xs text-gray-800">
                              <span>Local: {o.storeName}</span>
                              <span className="text-blue-700">Cobrado: ${Math.round(o.total)}</span>
                            </div>
                            <p className="text-[10px] text-gray-600">Cliente: {o.customerName} ({o.address})</p>
                            <div className="text-[10px] bg-gray-50 p-1.5 rounded border space-y-0.5">
                              {o.items && o.items.map((i, idx) => (
                                <p key={idx} className="text-gray-600">▪️ {i.quantity} {i.unit || 'Unid.'} x {i.name}</p>
                              ))}
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                  </div>
                )}
              </div>
            )}

            {/* 4. VISTA ADMIN (PROTEGIDA) */}
            {currentTab === 'admin' && (
              <div className="space-y-4 text-xs">
                {!isAdminLogged ? (
                  <form onSubmit={handleAdminLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Administrador</h2>
                    <input required type="password" placeholder="Contraseña Admin" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-5">
                    <div className="flex justify-between items-center bg-gray-800 text-white p-2 rounded">
                      <span className="font-bold">Panel Administrador</span>
                      <button onClick={()=>setIsAdminLogged(false)} className="text-red-300 font-bold underline">Salir</button>
                    </div>

                    <div className="border p-3 rounded bg-orange-50 border-orange-200 space-y-2">
                      <h3 className="font-bold text-orange-900 text-sm">📊 Rendición de Comisiones (10%)</h3>
                      {stores.length === 0 ? <p className="text-gray-500">No hay comercios cargados.</p> : null}
                      {stores.map(store => {
                        const storeOrders = orders.filter(o => o.storeId === store.id && o.status === 'entregado' && !o.storeSettled);
                        const totalSales = storeOrders.reduce((sum, o) => sum + o.subtotal, 0);
                        const commissionDue = Math.round(totalSales * STORE_COMMISSION_PERCENT);

                        return (
                          <div key={store.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                            <div>
                              <p className="font-bold text-gray-800">{store.name}</p>
                              <p className="text-gray-600">Ventas Pendientes: <strong>${Math.round(totalSales)}</strong></p>
                              <p className="text-orange-700 font-bold">Comisión 10%: ${commissionDue}</p>
                            </div>
                            <button 
                              onClick={()=>handleResetStoreCommission(store.id)}
                              disabled={commissionDue === 0}
                              className={`px-2.5 py-1.5 rounded font-bold text-white ${commissionDue > 0 ? 'bg-orange-600 hover:bg-orange-700' : 'bg-gray-300 cursor-not-allowed'}`}>
                              Cobrado
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    <div className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800 text-sm">🏪 Comercios Registrados</h3>
                      {stores.length === 0 ? (
                        <p className="text-gray-500">No hay comercios registrados actualmente.</p>
                      ) : (
                        stores.map(store => (
                          <div key={store.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                            <div>
                              <p className="font-bold text-gray-800">{store.name}</p>
                              <p className="text-gray-500 text-[11px]">{store.address} - Tel: {store.phone}</p>
                              <p className="text-gray-400 text-[10px]">Usuario: {store.user}</p>
                            </div>
                            <button 
                              onClick={() => handleDeleteStore(store.id, store.name)}
                              className="bg-red-600 text-white font-bold px-2 py-1.5 rounded text-[11px] shadow hover:bg-red-700">
                              🗑️ Eliminar
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="border p-3 rounded bg-blue-50 border-blue-200 space-y-2">
                      <h3 className="font-bold text-blue-900 text-sm">🛵 Cadetes / Repartidores Registrados</h3>
                      {cadetes.length === 0 ? (
                        <p className="text-gray-500">No hay cadetes registrados actualmente.</p>
                      ) : (
                        cadetes.map(cadete => (
                          <div key={cadete.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                            <div>
                              <p className="font-bold text-gray-800">{cadete.name} ({cadete.vehicle})</p>
                              <p className="text-gray-500 text-[11px]">Tel: {cadete.phone} | Usuario: {cadete.user}</p>
                              <p className="text-green-700 font-bold text-[11px]">Saldo actual: ${cadete.balance || 0}</p>
                            </div>
                            <button 
                              onClick={() => handleDeleteCadete(cadete.id, cadete.name)}
                              className="bg-red-600 text-white font-bold px-2 py-1.5 rounded text-[11px] shadow hover:bg-red-700">
                              🗑️ Eliminar
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <form onSubmit={handleRechargeBalance} className="border p-3 rounded bg-green-50 border-green-200 space-y-2">
                      <h3 className="font-bold text-green-900">💵 Acreditar Saldo a Cadete</h3>
                      <select required value={selectedCadeteId} onChange={e=>setSelectedCadeteId(e.target.value)} className="w-full p-2 border rounded bg-white">
                        <option value="">Selecciona un cadete...</option>
                        {cadetes.map(c => <option key={c.id} value={c.id}>{c.name} (Saldo actual: ${c.balance || 0})</option>)}
                      </select>
                      <input required type="number" placeholder="Monto a recargar ($)" value={rechargeAmount} onChange={e=>setRechargeAmount(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-green-700 text-white py-2 rounded font-bold">Cargar Saldo</button>
                    </form>

                    <form onSubmit={handleCreateCadete} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Registrar Nuevo Cadete</h3>
                      <input required type="text" placeholder="Nombre completo" value={newCadeteName} onChange={e=>setNewCadeteName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Teléfono WhatsApp (Ej: 3826123456)" value={newCadetePhone} onChange={e=>setNewCadetePhone(e.target.value)} className="w-full p-2 border rounded" />
                      <select value={newCadeteVehicle} onChange={e=>setNewCadeteVehicle(e.target.value)} className="w-full p-2 border rounded bg-white">
                        <option value="Moto">Moto</option>
                        <option value="Bicicleta">Bicicleta</option>
                        <option value="Auto">Auto</option>
                      </select>
                      <input required type="text" placeholder="Usuario para el cadete" value={newCadeteUser} onChange={e=>setNewCadeteUser(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Contraseña para el cadete" value={newCadetePass} onChange={e=>setNewCadetePass(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">Crear Cadete</button>
                    </form>

                    <form onSubmit={handleCreateStore} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Registrar Nuevo Comercio / Kiosco (con datos de pago)</h3>
                      <input required type="text" placeholder="Nombre del Negocio" value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Dirección del Local" value={newStoreAddress} onChange={e=>setNewStoreAddress(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="WhatsApp del local (Ej: 3826123456)" value={newStorePhone} onChange={e=>setNewStorePhone(e.target.value)} className="w-full p-2 border rounded" />
                      <input type="text" placeholder="Alias de Mercado Pago del Local" value={newStoreAlias} onChange={e=>setNewStoreAlias(e.target.value)} className="w-full p-2 border rounded font-mono" />
                      <input type="text" placeholder="Nombre del Titular de la cuenta" value={newStoreTitular} onChange={e=>setNewStoreTitular(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Horario (Ej: 08:00 a 23:00 hs)" value={newStoreHours} onChange={e=>setNewStoreHours(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Usuario para el comercio" value={newStoreUser} onChange={e=>setNewStoreUser(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Contraseña para el comercio" value={newStorePass} onChange={e=>setNewStorePass(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-gray-700 text-white py-2 rounded font-bold">Crear Comercio</button>
                    </form>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
