          unsubConfig();

      useEffect(() => {
        const interval = setInterval(async () => {
          const now = Date.now();
          for (const order of orders) {
            if (order.status === 'pendiente' && order.createdAt) {
              const orderTime = order.createdAt.toMillis ? order.createdAt.toMillis() : order.createdAt.seconds * 1000;
              const diffMinutes = (now - orderTime) / (1000 * 60);
              
              if (diffMinutes > 10) {
                try {
                  await db.collection('orders').doc(order.id).update({ status: 'cancelado_por_tiempo' });
                } catch (err) {
                  console.error("Error al expirar pedido automático:", err);
                }
              }
            }
          }
        }, 30000);

        return () => clearInterval(interval);
      }, [orders]);

      const [adminPass, setAdminPass] = useState('');

      const [newStoreName, setNewStoreName] = useState('');

      const [prodCategory, setProdCategory] = useState('General');

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const MAX_HEIGHT = 500;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            setProdImg(compressedBase64);
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const [cart, setCart] = useState([]);

      const handleAdminLogin = (e) => {

      const handleCreateStore = async (e) => {

      const handleDeleteStore = async (storeId, storeName) => {

      const handleCreateCadete = async (e) => {

      const handleRechargeBalance = async (e) => {

      const handleResetStoreCommission = async (storeId) => {
        if (confirm("¿Confirmas que abonaste la comisión acumulada? Esto pondrá tu saldo deudor en $0.")) {
          try {
            const batch = db.batch();
            const storeOrders = orders.filter(o => {
              const hasStore = o.storeId === storeId || (o.storesInvolved && o.storesInvolved.includes(storeId));
              return hasStore && o.status === 'entregado' && !o.storeSettled;
            });
            storeOrders.forEach(o => {
              const ref = db.collection('orders').doc(o.id);
              batch.update(ref, { storeSettled: true });
            });
            await batch.commit();
            alert("¡Comisión rendida con éxito! Tu saldo queda saldado.");

        try {
          const newBalance = (Number(loggedCadete.balance) || 0) - APP_FEE;

          await db.collection('orders').doc(orderId).update({ status: 'en_camino', cadeteId: loggedCadete.id });

          alert(`Tiempo guardado (${prepMinutes} mins). Notifica al cliente por WhatsApp si lo deseas.`);
          
          const msg = `Hola ${customerName}! Tu pedido en Catuna Pedidos fue confirmado y estará listo / en camino en aproximadamente ${prepMinutes} minutos. ¡Gracias por tu compra!`;
          window.open(`https://wa.me/549${customerPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        } catch (err) {
          alert("Error al actualizar tiempo: " + err.message);
        }
      };

      // PERMITIR AGREGAR PRODUCTOS DE CUALQUIER LOCAL AL CARRITO MULTI-LOCAL
      const addToCart = (product, store) => {
        const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
        if (onlineCadetesCount === 0) {
          alert("⚠️ En este momento no hay cadetes en línea disponibles. Intenta más tarde.");
          return;
        }

        if (!store.isOpen || store.isSuspended) {
          alert("Este negocio no está disponible actualmente.");
          return;
        }

        const qtyToAdd = Number(selectedQtyMap[product.id]) || 1;
        if (qtyToAdd <= 0) {
          alert("Ingresa una cantidad válida.");
          return;
        }

        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + qtyToAdd } : i));
        } else {
          setCart([...cart, { ...product, storeId: store.id, storeName: store.name, storeAddress: store.address, storePhone: store.phone, quantity: qtyToAdd }]);
        }
        setIsCartOpen(true);
      };

      const updateCartItemQuantity = (productId, newQty) => {
        const qty = Number(newQty);
        if (qty <= 0) {
          setCart(cart.filter(item => item.id !== productId));
        } else {
          setCart(cart.map(item => item.id === productId ? { ...item, quantity: qty } : item));
        }
      };

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        
        // Agrupar comercios involucrados y calcular costos
        const uniqueStoresMap = {};
        cart.forEach(item => {
          if (!uniqueStoresMap[item.storeId]) {
            uniqueStoresMap[item.storeId] = {
              storeId: item.storeId,
              storeName: item.storeName,
              storeAddress: item.storeAddress,
              storePhone: item.storePhone,
              items: []
            };
          }
          uniqueStoresMap[item.storeId].items.push(item);
        });

        const storesList = Object.values(uniqueStoresMap);
        const storesInvolvedIds = storesList.map(s => s.storeId);
        
        // Si hay más de 1 local, sumamos un plus de $500 por cada parada extra al envío
        const extraStopsCount = Math.max(0, storesList.length - 1);
        const totalDeliveryFee = BASE_DELIVERY_FEE + (extraStopsCount * 500);
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        try {
          // Registrar el pedido global en la base de datos
          await db.collection('orders').add({
            storesInvolved: storesInvolvedIds,
            storesList: storesList,
            customerName: custName,
            customerPhone: custPhone,
            address: custAddress,
            items: cart,
            deliveryFee: totalDeliveryFee,
            subtotal,
            total: subtotal + totalDeliveryFee,
            status: 'pendiente',
            cadeteId: null,
            storeSettled: false,
            prepTime: 'Por calcular',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          // Notificar por WhatsApp a cada local involucrado con su parte del pedido
          storesList.forEach(store => {
            const storeItemsList = store.items.map(i => `• ${i.quantity} ${i.unit || 'Unid.'} x ${i.name} ($${Math.round(i.price * i.quantity)})`).join('%0A');
            const storeSubtotal = store.items.reduce((s, i) => s + (i.price * i.quantity), 0);
            const msg = `🔔 *NUEVO PEDIDO MULTI-LOCAL - Catuna Pedidos*%0A%0A*Cliente:* ${encodeURIComponent(custName)}%0A*Tel:* ${encodeURIComponent(custPhone)}%0A*Dirección:* ${encodeURIComponent(custAddress)}%0A%0A*Tus productos en este pedido:*%0A${storeItemsList}%0A%0A*Subtotal a cobrar:* $${Math.round(storeSubtotal)}`;
            
            if (store.storePhone) {
              window.open(`https://wa.me/549${store.storePhone}?text=${msg}`, '_blank');
            }
          });

          setLastOrderSent({ storeName: storesList.map(s => s.name).join(', '), total: Math.round(subtotal + totalDeliveryFee) });
          setCart([]);
          setIsCartOpen(false);
          setCustName(''); setCustPhone(''); setCustAddress('');
          alert("¡Pedido multi-local enviado con éxito! Se notificó a los comercios por WhatsApp.");
        } catch (err) {
          alert("Error al enviar pedido: " + err.message);
        }
      };

      const filteredStores = stores.filter(store => {
        if (store.isSuspended) return false;
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;

        const matchesStore = store.name.toLowerCase().includes(query) || (store.address && store.address.toLowerCase().includes(query));
        const storeProds = products.filter(p => p.storeId === store.id);
        const matchesProduct = storeProds.some(p => p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));

        return matchesStore || matchesProduct;
      });

      const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;

      const promoProducts = products.filter(p => {
        if (!p.isPromo) return false;
        if (p.promoExpiresAt && currentTime > p.promoExpiresAt) return false;
        const store = stores.find(s => s.id === p.storeId);
        return store && store.isOpen && !store.isSuspended;
      });

      const getTimeLeftString = (expiresAt) => {
        if (!expiresAt) return "Por tiempo limitado";
        const diff = expiresAt - currentTime;
        if (diff <= 0) return "Expirando...";

          const days = Math.floor(hours / 24);
          return `Quedan ${days}d ${hours % 24}h`;
        }
        return `⏳ ${hours}h ${minutes}m ${seconds}s`;
      };

                    </div>
                    <button 
                      onClick={() => setIsCartOpen(true)}

                      <h3 className="font-bold text-blue-900 text-sm">🛵 Cadetes Registrados</h3>
                      {cadetes.map(cadete => (
                        <div key={cadete.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                          <div>
                            <p className="font-bold text-gray-800">
                              {cadete.name} ({cadete.vehicle})
                              {cadete.isSuspended && <span className="text-red-600 ml-1 text-[10px] bg-red-100 px-1 rounded font-bold">⚠️ SUSPENDIDO</span>}
                            </p>
                            <p className="text-gray-500 text-[11px]">Saldo: ${cadete.balance || 0}</p>
                          </div>
                          <div className="flex gap-1">
                            <button 
                              onClick={() => handleToggleCadeteSuspension(cadete.id, cadete.isSuspended)}
                              className={`font-bold px-2 py-1.5 rounded text-[10px] shadow text-white ${cadete.isSuspended ? 'bg-green-600' : 'bg-yellow-600'}`}>
                              {cadete.isSuspended ? 'Habilitar' : 'Suspender'}
                            </button>
                            <button onClick={() => handleDeleteCadete(cadete.id, cadete.name)} className="bg-red-600 text-white font-bold px-2 py-1.5 rounded text-[10px] shadow">🗑️</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleRechargeBalance} className="border p-3 rounded bg-green-50 border-green-200 space-y-2">
                      <h3 className="font-bold text-green-900">💵 Acreditar Saldo a Cadete</h3>
                      <select required value={selectedCadeteId} onChange={e=>setSelectedCadeteId(e.target.value)} className="w-full p-2 border rounded bg-white">
                        <option value="">Selecciona un cadete...</option>
                        {cadetes.map(c => <option key={c.id} value={c.id}>{c.name} (Saldo actual: ${c.balance || 0})</option>)}
                      </select>
                      <input required type="number" placeholder="Monto a recargar ($)" value={rechargeAmount} onChange={e=>setRechargeAmount(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-green-700 text-white py-2 rounded font-bold">Cargar Saldo</button>
                    </form>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
