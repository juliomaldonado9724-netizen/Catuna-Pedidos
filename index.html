      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const MAX_HEIGHT = 500;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
            setProdImg(compressedBase64);
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const addToCart = (product, store) => {
        const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
        if (onlineCadetesCount === 0) {
          alert("⚠️ En este momento no hay cadetes en línea disponibles. Intenta más tarde.");
          return;
        }

        if (!store.isOpen || store.isSuspended) {
          alert("Este negocio no está disponible actualmente.");
          return;

        const qtyToAdd = Number(selectedQtyMap[product.id]) || 1;
        if (qtyToAdd <= 0) {
          alert("Ingresa una cantidad válida.");
          return;
        }

        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + qtyToAdd } : i));
        } else {
          setCart([...cart, { ...product, storeId: store.id, storeName: store.name, storeAddress: store.address, storePhone: store.phone, quantity: qtyToAdd }]);
        }
        setIsCartOpen(true);
      };

      const updateCartItemQuantity = (productId, newQty) => {
        const qty = Number(newQty);
        if (qty <= 0) {
          setCart(cart.filter(item => item.id !== productId));
        } else {
          setCart(cart.map(item => item.id === productId ? { ...item, quantity: qty } : item));
        }
      };

      // CÁLCULOS DEL CARRITO
      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const uniqueStoresInCart = [...new Set(cart.map(i => i.storeId))].length;
      const calculatedDeliveryFee = BASE_DELIVERY_FEE + (Math.max(0, uniqueStoresInCart - 1) * 500);

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        
        const uniqueStoresMap = {};
        cart.forEach(item => {
          if (!uniqueStoresMap[item.storeId]) {
            const storeDoc = stores.find(s => s.id === item.storeId);
            uniqueStoresMap[item.storeId] = {
              storeId: item.storeId,
              storeName: item.storeName,
              storeAddress: item.storeAddress,
              storePhone: storeDoc ? storeDoc.phone : '',
              alias: storeDoc ? storeDoc.alias : '',
              items: []
            };
          }
          uniqueStoresMap[item.storeId].items.push(item);
        });

        const storesList = Object.values(uniqueStoresMap);
        const storesInvolvedIds = storesList.map(s => s.storeId);
        
        const subtotal = cartSubtotal;
        const totalDeliveryFee = calculatedDeliveryFee; 
        const grandTotal = subtotal + totalDeliveryFee;
        
        try {
          const docRef = await db.collection('orders').add({
            storesInvolved: storesInvolvedIds,
            storesList: storesList,
            customerName: custName,
            customerPhone: custPhone,
            address: custAddress,
            coords: custCoords || null,
            paymentMethod: paymentMethod,
            items: cart,
            deliveryFee: totalDeliveryFee,
            subtotal: subtotal,
            total: grandTotal,
            status: 'pendiente',
            cadeteId: null,
            storeSettled: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          setLastOrderId(docRef.id);
          setCart([]);
          setIsCartOpen(false);
          setCustName(''); setCustPhone(''); setCustAddress(''); setCustCoords(null); setPaymentMethod('Efectivo');
          alert("¡Pedido enviado con éxito! Notifica a cada comercio por WhatsApp usando los botones.");
        } catch (err) {
          alert("Error al enviar pedido: " + err.message);
        }
      };

      const filteredStores = stores.filter(store => {
        if (store.isSuspended) return false;
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;

        const matchesStore = store.name.toLowerCase().includes(query) || (store.address && store.address.toLowerCase().includes(query));
        const storeProds = products.filter(p => p.storeId === store.id);
        const matchesProduct = storeProds.some(p => p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));

        return matchesStore || matchesProduct;
      });

      const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;

      const promoProducts = products.filter(p => {
        if (!p.isPromo) return false;
        if (p.promoExpiresAt && currentTime > p.promoExpiresAt) return false;
        const store = stores.find(s => s.id === p.storeId);
        return store && store.isOpen && !store.isSuspended;
      });

      const getTimeLeftString = (expiresAt) => {
        if (!expiresAt) return "Por tiempo limitado";
        const diff = expiresAt - currentTime;
        if (diff <= 0) return "Expirando...";
        
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        if (hours > 24) {
          const days = Math.floor(hours / 24);
          return `Quedan ${days}d ${hours % 24}h`;
        }
        return `⏳ ${hours}h ${minutes}m ${seconds}s`;
      };

      const totalCartItemsCount = cart.reduce((sum, item) => sum + Number(item.quantity), 0);

      // BUSCAR ÚLTIMO PEDIDO REALIZADO POR EL CLIENTE EN TIEMPO REAL
      const activeLiveOrder = orders.find(o => o.id === lastOrderId);
      const activeCadete = activeLiveOrder ? cadetes.find(c => c.id === activeLiveOrder.cadeteId) : null;

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl relative pb-24">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Delivery Local (Multi-Local)</p>
            </div>
            <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
          </header>

          {globalAnnouncement && currentTab === 'cliente' && (
            <div className="bg-amber-500 text-amber-950 font-bold px-4 py-2 text-xs text-center border-b border-amber-600 shadow-inner flex items-center justify-center gap-2">
              <span>📢</span> <span>{globalAnnouncement}</span>
            </div>
          )}

          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          <main className="flex-1 p-4 overflow-y-auto">

            {/* 1. VISTA CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-4">
                
                {/* TRACKING EN TIEMPO REAL CON ESTADOS EXACTOS */}
                {activeLiveOrder && activeLiveOrder.status !== 'entregado' && activeLiveOrder.status !== 'cancelado_por_tiempo' && (
                  <div className={`p-4 rounded-xl border-2 text-center space-y-3 shadow-lg transition-all ${activeLiveOrder.status === 'en_camino' ? 'bg-green-50 border-green-500 animate-pulse' : 'bg-orange-50 border-orange-400'}`}>
                    
                    {/* AVISO CLARO DEL ESTADO ACTUAL */}
                    <div className="bg-white p-2.5 rounded-lg border shadow-sm space-y-1">
                      <div className="flex items-center justify-center gap-2">
                        <span className="text-xl">{activeLiveOrder.status === 'en_camino' ? '🛵' : '⏳'}</span>
                        <h3 className="font-extrabold text-xs text-gray-900 uppercase">
                          {activeLiveOrder.status === 'en_camino' 
                            ? '¡Tu pedido va en camino!' 
                            : activeLiveOrder.status === 'tomado_por_cadete'
                            ? 'El cadete aceptó el pedido (Esperando que esté listo)'
                            : 'Pedido enviado (Esperando cadete)'}
                        </h3>
                      </div>
                      <p className="text-[11px] text-gray-600">
                        {activeLiveOrder.status === 'en_camino' 
                          ? '📢 El cadete retiró los productos y se dirige a tu domicilio.'
                          : activeLiveOrder.status === 'tomado_por_cadete'
                          ? '📢 Un cadete ya tomó tu pedido y está atento a que el comercio confirme que está listo.'
                          : '📢 Tu pedido fue registrado y está a la espera de que un cadete lo tome.'}
                      </p>
                    </div>

                    <p className="text-xs text-gray-700">
                      Total a pagar: <strong>${activeLiveOrder.total}</strong> ({activeLiveOrder.paymentMethod})
                    </p>

                    {activeLiveOrder.storesList && (
                      <div className="bg-white p-2.5 rounded-lg border border-orange-200 text-left text-xs space-y-2 shadow-sm">
                        <p className="font-bold text-orange-900">🔔 Notifica a cada comercio por WhatsApp:</p>
                        {activeLiveOrder.storesList.map((s, idx) => {
                          const storeItemsList = s.items.map(i => `• ${i.quantity} ${i.unit || 'Unid.'} x ${i.name} ($${Math.round(i.price * i.quantity)})`).join('%0A');
                          const storeSubtotal = s.items.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                          const storeMsg = `🔔 *NUEVO PEDIDO - Catuna Pedidos*%0A%0A*Cliente:* ${encodeURIComponent(activeLiveOrder.customerName)}%0A*Pago:* ${encodeURIComponent(activeLiveOrder.paymentMethod)}%0A*Dirección:* ${encodeURIComponent(activeLiveOrder.address)}%0A%0A*Tus productos:*%0A${storeItemsList}%0A%0A*Subtotal:* $${Math.round(storeSubtotal)}`;

                          return (
                            <div key={idx} className="flex justify-between items-center border-b pb-1 last:border-b-0">
                              <span><strong>{s.storeName}</strong></span>
                              {s.storePhone ? (
                                <a 
                                  href={`https://wa.me/549${s.storePhone}?text=${storeMsg}`} 
                                  target="_blank" 
                                  className="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded text-[11px] font-bold shadow flex items-center gap-1">
                                  💬 Enviar a {s.storeName}
                                </a>
                              ) : (
                                <span className="text-gray-400 text-[10px]">Sin teléfono</span>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {activeLiveOrder.status === 'en_camino' && activeCadete ? (
                      <div className="bg-white p-2.5 rounded-lg border border-green-200 text-left text-xs space-y-1.5 shadow-sm">
                        <p className="font-bold text-green-900 flex justify-between">
                          <span>Repartidor asignado:</span>
                          <span className="text-green-700 font-extrabold">{activeCadete.name}</span>
                        </p>
                        <p className="text-gray-600">Vehículo: <strong>{activeCadete.vehicle}</strong></p>
                        
                        <a 
                          href={`https://wa.me/549${activeCadete.phone}?text=Hola%20${encodeURIComponent(activeCadete.name)},%20te%20escribo%20por%20mi%20pedido%20en%20Catuna%20Pedidos.`}
                          target="_blank"
                          className="block w-full bg-green-600 hover:bg-green-700 text-white font-bold text-center py-1.5 rounded shadow mt-1">
                          💬 Contactar al Cadete por WhatsApp
                        </a>
                      </div>
                    ) : (
                      <p className="text-[11px] text-orange-800 italic">
                        {activeCadete ? `Cadete asignado: ${activeCadete.name} (Esperando que el comercio confirme que está listo)` : 'Esperando que un cadete acepte el envío...'}
                      </p>
                    )}

                    {activeLiveOrder.paymentMethod === 'Transferencia' && activeLiveOrder.storesList && (
                      <div className="bg-amber-50 border border-amber-200 p-2 rounded text-[11px] text-left space-y-1 mt-2">
                        <p className="font-bold text-amber-900">💳 Alias para transferir productos:</p>
                        {activeLiveOrder.storesList.map((s, idx) => (
                          <div key={idx} className="flex justify-between items-center border-b pb-1 last:border-b-0">
                            <span><strong>{s.storeName}:</strong> <span className="font-mono font-bold select-all">{s.alias || 'Consultar local'}</span></span>
                            {s.storePhone && (
                              <a href={`https://wa.me/549${s.storePhone}?text=Hola,%20te%20envío%20el%20comprobante%20de%20mi%20pedido:`} target="_blank" className="bg-green-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">
                                💬 Comprobante
                              </a>
                            )}
                          </div>
                        ))}
                      </div>
                    )}

                    <button onClick={() => setLastOrderId(null)} className="text-[10px] text-gray-400 underline pt-1 block mx-auto">Ocultar aviso</button>
                  </div>
                )}

                <div className={`p-2.5 rounded-lg border text-center text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm ${onlineCadetesCount > 0 ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800'}`}>
                  {onlineCadetesCount > 0 ? (
                    <><span>🛵</span> <span>¡Hay {onlineCadetesCount} {onlineCadetesCount === 1 ? 'cadete activo' : 'cadetes activos'} listos para repartir!</span></>
                  ) : (
                    <><span>⚠️</span> <span>No hay cadetes activos en este momento. Pedidos pausados temporalmente.</span></>
                  )}
                </div>

                {promoProducts.length > 0 && (
                  <div className="bg-gradient-to-r from-red-50 to-amber-50 border-2 border-red-400 p-3 rounded-xl shadow-sm space-y-2">
                    <h2 className="font-extrabold text-red-700 text-sm flex items-center gap-1.5">
                      🔥 ¡Promociones y Ofertas del Día! 🔥
                    </h2>
                    
                    <div className="flex gap-3 overflow-x-auto pb-2 scrollbar-thin">
                      {promoProducts.map(prod => {
                        const store = stores.find(s => s.id === prod.storeId);
                        const currentQty = selectedQtyMap[prod.id] !== undefined ? selectedQtyMap[prod.id] : 1;

                        return (
                          <div key={prod.id} className="min-w-[190px] max-w-[190px] bg-white p-2 rounded-lg border border-red-200 shadow-sm flex flex-col justify-between flex-shrink-0">
                            <div>
                              <div className="relative">
                                <img src={prod.image} className="w-full h-24 object-cover rounded bg-gray-200" alt={prod.name} />
                                <span className="absolute top-1 right-1 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow">
                                  {getTimeLeftString(prod.promoExpiresAt)}
                                </span>
                              </div>
                              <p className="font-bold text-xs text-gray-800 mt-1 truncate">{prod.name}</p>
                              <p className="text-[10px] text-gray-500 truncate">🏪 {store?.name}</p>
                              <p className="text-xs font-extrabold text-red-600 mt-0.5">${prod.price} <span className="text-[9px] text-gray-400">/ {prod.unit || 'Unid.'}</span></p>
                            </div>

                            <div className="mt-2 pt-1 border-t flex items-center justify-between">
                              <input 
                                type="number" 
                                min="0.1" 
                                value={currentQty} 
                                onChange={(e) => setSelectedQtyMap({ ...selectedQtyMap, [prod.id]: e.target.value })}
                                className="w-12 text-[10px] p-1 border rounded font-bold text-center bg-gray-50"
                              />
                              <button 
                                onClick={() => addToCart(prod, store)} 
                                className="text-[10px] bg-red-600 text-white px-2 py-1 rounded font-bold hover:bg-red-700 shadow">
                                + Pedir
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="relative">
                  <input 
                    type="text"
                    placeholder="🔍 Buscar negocio o producto (ej: Kiosco, Fernet, Bife)..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full text-xs p-2.5 pl-3 pr-8 border-2 border-red-200 rounded-lg shadow-sm focus:outline-none focus:border-red-600 bg-gray-50"
                  />
                  {searchTerm && (
                    <button 
                      onClick={() => setSearchTerm('')} 
                      className="absolute right-2.5 top-2.5 text-xs text-gray-400 font-bold hover:text-gray-600">
                      ✕
                    </button>
                  )}
                </div>

                {filteredStores.length === 0 ? (
                  <div className="text-center py-10 text-gray-500">
                    <p className="font-bold text-base">No se encontraron comercios</p>
                    <p className="text-xs">Prueba buscando otro nombre o producto.</p>
                  </div>
                ) : (
                  filteredStores.map(store => {
                    const storeProducts = products.filter(p => {
                      if (p.storeId !== store.id) return false;
                      const q = searchTerm.toLowerCase().trim();
                      if (!q) return true;
                      
                      const matchesStore = store.name.toLowerCase().includes(q) || (store.address && store.address.toLowerCase().includes(q));
                      if (matchesStore) return true;

                      return p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q));
                    });

                    const categoriesMap = {};
                    storeProducts.forEach(prod => {
                      const cat = prod.category || 'General';
                      if (!categoriesMap[cat]) categoriesMap[cat] = [];
                      categoriesMap[cat].push(prod);
                    });

                    return (
                      <div key={store.id} className="border rounded-lg p-3 bg-gray-50 shadow-sm space-y-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-gray-800 text-base">{store.name}</h3>
                            <p className="text-xs text-gray-500">{store.address}</p>
                            <p className="text-[11px] text-gray-400">🕒 Horario: {store.hours}</p>
                          </div>
                          <span className={`text-[10px] font-bold px-2 py-1 rounded ${store.isOpen ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}`}>
                            {store.isOpen ? '🟢 ABIERTO' : '🔴 CERRADO'}
                          </span>
                        </div>

                        {store.alias && (
                          <div className="bg-amber-50 border border-amber-200 p-2 rounded text-[11px] space-y-0.5">
                            <p className="font-bold text-amber-900">💳 Datos para transferir la compra:</p>
                            <p className="text-gray-700"><strong>Alias:</strong> <span className="font-mono font-bold select-all">{store.alias}</span></p>
                            {store.titular && <p className="text-gray-700"><strong>Titular:</strong> {store.titular}</p>}
                          </div>
                        )}

                        <div className="space-y-3">
                          {storeProducts.length === 0 ? (
                            <p className="text-[11px] text-gray-400 italic">No hay productos cargados en este local.</p>
                          ) : (
                            Object.keys(categoriesMap).map(categoryName => (
                              <div key={categoryName} className="space-y-1.5">
                                <h4 className="text-xs font-bold text-red-600 uppercase tracking-wide border-b border-red-200 pb-0.5 mt-2">
                                  📁 {categoryName}
                                </h4>
                                {categoriesMap[categoryName].map(prod => {
                                  const currentQty = selectedQtyMap[prod.id] !== undefined ? selectedQtyMap[prod.id] : 1;
                                  const calculatedPrice = Math.round(prod.price * (Number(currentQty) || 1));

                                  return (
                                    <div key={prod.id} className="flex gap-3 bg-white p-2 rounded border items-center">
                                      <img src={prod.image} className="w-16 h-16 object-cover rounded bg-gray-200" alt={prod.name} />
                                      <div className="flex-1">
                                        <div className="flex items-center gap-1.5">
                                          <p className="font-bold text-sm text-gray-800">{prod.name}</p>
                                          {prod.isPromo && (!prod.promoExpiresAt || currentTime <= prod.promoExpiresAt) && (
                                            <span className="bg-red-100 text-red-700 font-extrabold text-[9px] px-1 py-0.5 rounded">🔥 PROMO</span>
                                          )}
                                        </div>
                                        <p className="text-xs text-gray-500">{prod.description}</p>
                                        <p className="text-xs font-bold text-red-600 mt-0.5">${prod.price} <span className="text-[10px] text-gray-400">/ {prod.unit || 'Unidad'}</span></p>
                                        
                                        <div className="mt-1 flex items-center gap-1.5">
                                          <span className="text-[10px] font-semibold text-gray-600">Cant:</span>
                                          <input 
                                            type="number" 
                                            step={prod.unit === 'Kg' ? '0.25' : (prod.unit === '100g' ? '0.5' : '1')}
                                            min="0.1" 
                                            value={currentQty} 
                                            onChange={(e) => setSelectedQtyMap({ ...selectedQtyMap, [prod.id]: e.target.value })}
                                            className="w-14 text-xs p-1 border rounded font-bold text-center bg-gray-50"
                                          />
                                          <span className="text-[10px] text-gray-500">{prod.unit || 'Unid.'}</span>
                                        </div>
                                      </div>

                                      <div className="text-right flex flex-col items-end gap-1">
                                        <p className="text-xs font-extrabold text-gray-800">${calculatedPrice}</p>
                                        <button 
                                          onClick={() => addToCart(prod, store)} 
                                          disabled={!store.isOpen || onlineCadetesCount === 0}
                                          className={`text-xs px-2.5 py-1 rounded font-bold ${store.isOpen && onlineCadetesCount > 0 ? 'bg-red-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                                          {store.isOpen && onlineCadetesCount > 0 ? '+ Agregar' : 'No disponible'}
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })
                )}

                {cart.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-900 text-white p-3 shadow-2xl z-50 flex justify-between items-center border-t-2 border-red-500">
                    <div>
                      <p className="text-[10px] text-gray-300">🛒 {uniqueStoresInCart} {uniqueStoresInCart === 1 ? 'comercio' : 'comercios'} en tu carrito</p>
                      <p className="text-xs font-bold">{totalCartItemsCount} ítems | Subtotal: ${Math.round(cartSubtotal)}</p>
                    </div>
                    <button 
                      onClick={() => setIsCartOpen(true)}
                      className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold text-xs shadow animate-pulse">
                      Ver Carrito Multi-Local ➔
                    </button>
                  </div>
                )}

                {isCartOpen && (
                  <div className="fixed inset-0 bg-black/60 z-50 flex flex-col justify-end max-w-md mx-auto">
                    <div className="bg-white rounded-t-2xl p-4 space-y-3 max-h-[85vh] overflow-y-auto shadow-2xl">
                      <div className="flex justify-between items-center border-b pb-2">
                        <div>
                          <h3 className="font-extrabold text-sm text-gray-900">🛒 Carrito de Compras (Multi-Local)</h3>
                          <p className="text-[11px] text-gray-500">Puedes pedir a varios negocios en una sola salida.</p>
                        </div>
                        <button onClick={() => setIsCartOpen(false)} className="text-gray-400 font-bold text-sm p-1 hover:text-gray-600">✕</button>
                      </div>

                      <div className="space-y-3 max-h-40 overflow-y-auto bg-gray-50 p-2 rounded-lg border">
                        {cart.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center bg-white p-2 rounded border text-xs shadow-sm">
                            <div className="flex-1 pr-2">
                              <p className="font-bold text-gray-800">{item.name}</p>
                              <p className="text-[10px] text-red-600 font-bold">🏪 {item.storeName}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <input 
                                type="number" 
                                min="0.1" 
                                step={item.unit === 'Kg' ? '0.25' : '1'}
                                value={item.quantity} 
                                onChange={(e) => updateCartItemQuantity(item.id, e.target.value)}
                                className="w-14 text-center p-1 border rounded font-bold text-xs bg-gray-50"
                              />
                              <span className="font-extrabold text-red-600 w-16 text-right">${Math.round(item.price * item.quantity)}</span>
                              <button onClick={() => updateCartItemQuantity(item.id, 0)} className="text-red-500 font-bold text-xs px-1 hover:text-red-700">🗑️</button>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="bg-gray-100 p-2.5 rounded-lg text-xs space-y-1">
                        <div className="flex justify-between text-gray-600">
                          <span>Subtotal Productos:</span>
                          <span className="font-bold">${Math.round(cartSubtotal)}</span>
                        </div>
                        <div className="flex justify-between text-gray-600">
                          <span>Costo de Envío ({uniqueStoresInCart} {uniqueStoresInCart === 1 ? 'parada' : 'paradas'}):</span>
                          <span className="font-bold">${calculatedDeliveryFee}</span>
                        </div>
                        <div className="flex justify-between text-gray-900 font-extrabold text-sm pt-1 border-t border-gray-300">
                          <span>TOTAL A PAGAR:</span>
                          <span className="text-red-600">${Math.round(cartSubtotal + calculatedDeliveryFee)}</span>
                        </div>
                      </div>

                      <form onSubmit={handleCreateOrder} className="space-y-2.5 pt-1">
                        <p className="text-xs font-bold text-gray-800">Datos para la entrega:</p>
                        <input required placeholder="Tu Nombre Completo" value={custName} onChange={e=>setCustName(e.target.value)} className="w-full text-xs p-2 border rounded" />
                        <input required placeholder="Teléfono WhatsApp (Ej: 3826123456)" value={custPhone} onChange={e=>setCustPhone(e.target.value)} className="w-full text-xs p-2 border rounded" />
                        
                        <div className="space-y-1">
                          <div className="flex gap-2">
                            <input 
                              required 
                              placeholder="Dirección exacta o referencias" 
                              value={custAddress} 
                              onChange={e=>setCustAddress(e.target.value)} 
                              className="flex-1 text-xs p-2 border rounded" 
                            />
                            <button 
                              type="button" 
                              onClick={handleGetLocationGPS}
                              disabled={isGettingLocation}
                              className="bg-blue-600 text-white font-bold px-3 py-1.5 rounded text-[11px] shadow hover:bg-blue-700 flex items-center gap-1 flex-shrink-0">
                              {isGettingLocation ? '⏳ Buscando...' : '📍 Usar GPS'}
                            </button>
                          </div>
                          {custCoords && (
                            <p className="text-[10px] text-green-600 font-bold">✅ Ubicación GPS guardada correctamente.</p>
                          )}
                        </div>

                        <div className="bg-amber-50 border border-amber-300 p-2.5 rounded space-y-1.5">
                          <label className="block text-xs font-bold text-amber-900">💵 Selecciona la Forma de Pago:</label>
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              type="button"
                              onClick={() => setPaymentMethod('Efectivo')}
                              className={`py-2 rounded font-bold text-xs border ${paymentMethod === 'Efectivo' ? 'bg-green-600 text-white border-green-700 shadow' : 'bg-white text-gray-700 border-gray-300'}`}>
                              💵 Efectivo (al cadete)
                            </button>
                            <button
                              type="button"
                              onClick={() => setPaymentMethod('Transferencia')}
                              className={`py-2 rounded font-bold text-xs border ${paymentMethod === 'Transferencia' ? 'bg-blue-600 text-white border-blue-700 shadow' : 'bg-white text-gray-700 border-gray-300'}`}>
                              💳 Transferencia (Mercado Pago)
                            </button>
                          </div>
                        </div>
                        
                        <div className="flex gap-2 pt-2">
                          <button type="button" onClick={() => setIsCartOpen(false)} className="flex-1 bg-gray-300 text-gray-700 py-2 rounded font-bold text-xs">
                            Seguir Comprando
                          </button>
                          <button type="submit" className="flex-1 bg-red-600 text-white py-2 rounded font-bold text-xs shadow hover:bg-red-700">
                            Confirmar Pedido 🚀
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 2. VISTA COMERCIO */}
            {currentTab === 'comercio' && (
              <div className="space-y-4">

                        <input required placeholder="Clave para entrar" value={newCadetePass} onChange={e=>setNewCadetePass(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      </div>
                      <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold shadow hover:bg-blue-700">
                        Crear Cadete 🛵
                      </button>
                    </form>

                    <div className="border p-3 rounded bg-orange-50 border-orange-200 space-y-2">
                      <h3 className="font-bold text-orange-900 text-sm">📊 Rendición de Comisiones (5% Semanal)</h3>
                      <p className="text-[11px] text-orange-800">Cuando el comercio te transfiera, haz clic en <strong>"Marcar como Cobrado"</strong> para saldar su deuda a $0.</p>
                      
                      {stores.map(store => {
                        const storeOrders = orders.filter(o => {
                          const hasStore = o.storeId === store.id || (o.storesInvolved && o.storesInvolved.includes(store.id));
                          return hasStore && o.status === 'entregado' && !o.storeSettled;
                        });
                        
                        const totalSales = storeOrders.reduce((sum, o) => {
                          if (o.storesList) {
                            const myStorePart = o.storesList.find(s => s.storeId === store.id);
                            if (myStorePart) return sum + myStorePart.items.reduce((s, i) => s + (i.price * i.quantity), 0);
                          }
                          return sum + (o.subtotal || 0);
                        }, 0);

                        const commissionDue = Math.round(totalSales * STORE_COMMISSION_PERCENT);

                        return (
                          <div key={store.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                            <div>
                              <p className="font-bold text-gray-800">{store.name}</p>
                              <p className="text-gray-600">Ventas: <strong>${Math.round(totalSales)}</strong></p>
                              <p className="text-orange-700 font-bold">Comisión 5%: ${commissionDue}</p>
                            </div>
                            <button 
                              onClick={()=>handleResetStoreCommission(store.id, store.name)}
                              disabled={commissionDue === 0}
                              className={`px-2.5 py-1.5 rounded font-bold text-white ${commissionDue > 0 ? 'bg-green-600 hover:bg-green-700 shadow' : 'bg-gray-300 cursor-not-allowed'}`}>
                              {commissionDue > 0 ? '✅ Marcar como Cobrado' : 'Al día'}
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    <div className="border p-3 rounded bg-green-50 border-green-200 space-y-2">
                      <h3 className="font-bold text-green-900 text-sm">📱 Agenda de WhatsApp y Alias de Comercios</h3>
                      <p className="text-[11px] text-green-800">Números directos de los comercios para coordinar la comisión o comunicarte:</p>
                      {stores.length === 0 ? (
                        <p className="text-gray-500 italic">No hay comercios registrados aún.</p>
                      ) : (
                        stores.map(store => (
                          <div key={store.id} className="bg-white p-2.5 rounded border space-y-1">
                            <div className="flex justify-between items-center">
                              <p className="font-bold text-gray-800 text-xs">🏪 {store.name}</p>
                              {store.phone && (
                                <a 
                                  href={`https://wa.me/549${store.phone}?text=Hola%20${encodeURIComponent(store.name)},%20te%20escribo%20desde%20Catuna%20Pedidos%20por%20el%20cierre%20de%20comisión%20de%20la%20semana.`} 
                                  target="_blank" 
                                  className="bg-green-600 text-white px-2 py-1 rounded text-[10px] font-bold shadow hover:bg-green-700 flex items-center gap-1">
                                  💬 Abrir WhatsApp
                                </a>
                              )}
                            </div>
                            <p className="text-[11px] text-gray-600">📞 Tel: <strong>{store.phone || 'No registrado'}</strong></p>
                            <p className="text-[11px] text-gray-600">💳 Alias: <span className="font-mono font-bold select-all">{store.alias || 'No registrado'}</span></p>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="border p-3 rounded bg-blue-50 border-blue-200 space-y-3">
                      <h3 className="font-bold text-blue-900 text-sm">🛵 Recargar Saldo a Cadete</h3>
                      <form onSubmit={handleRechargeBalance} className="space-y-2">
                        <select 
                          required 
                          value={selectedCadeteId} 
                          onChange={(e)=>setSelectedCadeteId(e.target.value)} 
                          className="w-full p-2 border rounded bg-white text-xs font-bold">
                          <option value="">Seleccionar Cadete...</option>
                          {cadetes.map(c => (
                            <option key={c.id} value={c.id}>{c.name} (Saldo actual: ${c.balance || 0})</option>
                          ))}
                        </select>
                        <input 
                          required 
                          type="number" 
                          placeholder="Monto a recargar ($)" 
                          value={rechargeAmount} 
                          onChange={(e)=>setRechargeAmount(e.target.value)} 
                          className="w-full p-2 border rounded bg-white" 
                        />
                        <button type="submit" className="w-full bg-blue-600 text-white py-1.5 rounded font-bold shadow">
                          Acreditar Saldo ➕
                        </button>
                      </form>
                    </div>

                    <form onSubmit={handlePublishAnnouncement} className="border p-3 rounded bg-amber-50 border-amber-300 space-y-2">
                      <h3 className="font-bold text-amber-900 text-sm">📢 Anuncio Global para Clientes</h3>
                      <input placeholder="Ej: ¡Hoy horario especial por feriado!" value={announcementInput} onChange={e=>setAnnouncementInput(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <div className="flex gap-2">
                        <button type="submit" className="flex-1 bg-amber-600 text-white py-1.5 rounded font-bold">Publicar</button>
                        {globalAnnouncement && <button type="button" onClick={handleClearAnnouncement} className="bg-red-600 text-white px-3 py-1.5 rounded font-bold">Borrar</button>}
                      </div>
                    </form>

                    <div className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800 text-sm">🏪 Comercios Registrados</h3>
                      {stores.map(store => (
                        <div key={store.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                          <div>
                            <p className="font-bold text-gray-800">{store.name}</p>
                            <p className="text-[10px] text-gray-500">Usuario: {store.user}</p>
                          </div>
                          <div className="flex gap-1">
                            <button 
                              onClick={() => handleToggleStoreSuspension(store.id, store.isSuspended)} 
                              className={`font-bold px-2 py-1 rounded text-[10px] text-white ${store.isSuspended ? 'bg-green-600' : 'bg-orange-500'}`}>
                              {store.isSuspended ? 'Activar' : 'Pausar'}
                            </button>
                            <button onClick={() => handleDeleteStore(store.id, store.name)} className="bg-red-600 text-white font-bold px-2 py-1 rounded text-[10px]">🗑️</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800 text-sm">🛵 Cadetes Registrados</h3>
                      {cadetes.map(cadete => (
                        <div key={cadete.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                          <div>
                            <p className="font-bold text-gray-800">{cadete.name} ({cadete.vehicle})</p>
                            <p className="text-gray-500 text-[10px]">Saldo: ${cadete.balance || 0} | Usuario: {cadete.user}</p>
                          </div>
                          <div className="flex gap-1">
                            <button 
                              onClick={() => handleToggleCadeteSuspension(cadete.id, cadete.isSuspended)} 
                              className={`font-bold px-2 py-1 rounded text-[10px] text-white ${cadete.isSuspended ? 'bg-green-600' : 'bg-orange-500'}`}>
                              {cadete.isSuspended ? 'Activar' : 'Pausar'}
                            </button>
                            <button onClick={() => handleDeleteCadete(cadete.id, cadete.name)} className="bg-red-600 text-white font-bold px-2 py-1 rounded text-[10px]">🗑️</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
