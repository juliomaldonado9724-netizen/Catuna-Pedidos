  <meta charset="UTF-8">

<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDVtOX-_9idM9YiNAem5fc1SiGZLjypJ-Y",
      authDomain: "catunapedidos.firebaseapp.com",
      projectId: "catunapedidos",
      storageBucket: "catunapedidos.appspot.com",
      messagingSenderId: "344968029861",
      appId: "1:344968029861:web:c701d3528c88aec735cf4c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const playBeep = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    };

    function App() {
      const [currentTab, setCurrentTab] = useState('cliente');
      const [darkMode, setDarkMode] = useState(false);

      const ADMIN_PAYMENT_INFO = {
        alias: "Juliomaldonado132",
        titular: "Julio Nicolás Maldonado",
        banco: "Mercado Pago"
      };

      const STORE_COMMISSION_PERCENT = 0.05; 
      const APP_FEE = 300; 
      const BASE_DELIVERY_FEE = 1500; 

      const [stores, setStores] = useState([]);
      const [products, setProducts] = useState([]);
      const [cadetes, setCadetes] = useState([]);
      const [orders, setOrders] = useState([]);
      const [globalAnnouncement, setGlobalAnnouncement] = useState('');

      const [searchTerm, setSearchTerm] = useState('');
      const [currentTime, setCurrentTime] = useState(Date.now());
      const [isCartOpen, setIsCartOpen] = useState(false);
      
      const [clientPhoneInput, setClientPhoneInput] = useState('');
      const [clientHistory, setClientHistory] = useState([]);

      const [ratingStore, setRatingStore] = useState(5);
      const [ratingCadete, setRatingCadete] = useState(5);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const unsubStores = db.collection('stores').onSnapshot(snapshot => {
          setStores(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubProducts = db.collection('products').onSnapshot(snapshot => {
          setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubCadetes = db.collection('cadetes').onSnapshot(snapshot => {
          setCadetes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubOrders = db.collection('orders').onSnapshot(snapshot => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') playBeep();
          });
          setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        const unsubConfig = db.collection('config').doc('announcement').onSnapshot(doc => {
          if (doc.exists) setGlobalAnnouncement(doc.data().text || '');
        });

        return () => {
          unsubStores(); unsubProducts(); unsubCadetes(); unsubOrders(); unsubConfig();
        };
      }, []);

      const [adminPass, setAdminPass] = useState('');
      const [isAdminLogged, setIsAdminLogged] = useState(false);
      
      const [newStoreName, setNewStoreName] = useState('');
      const [newStoreAddress, setNewStoreAddress] = useState('');
      const [newStorePhone, setNewStorePhone] = useState('');
      const [newStoreAlias, setNewStoreAlias] = useState('');
      const [newStoreTitular, setNewStoreTitular] = useState('');
      const [newStoreHours, setNewStoreHours] = useState('08:00 a 23:00 hs');
      const [newStoreUser, setNewStoreUser] = useState('');
      const [newStorePass, setNewStorePass] = useState('');

      const [newCadeteName, setNewCadeteName] = useState('');
      const [newCadetePhone, setNewCadetePhone] = useState('');
      const [newCadeteUser, setNewCadeteUser] = useState('');
      const [newCadetePass, setNewCadetePass] = useState('');
      const [newCadeteVehicle, setNewCadeteVehicle] = useState('Moto');

      const [selectedCadeteId, setSelectedCadeteId] = useState('');
      const [rechargeAmount, setRechargeAmount] = useState('');
      const [announcementInput, setAnnouncementInput] = useState('');

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loggedStore, setLoggedStore] = useState(null);
      const [loggedCadete, setLoggedCadete] = useState(null);

      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [prodUnit, setProdUnit] = useState('Unidad');
      const [prodCategory, setProdCategory] = useState('General');
      const [prodIsPromo, setProdIsPromo] = useState(false);
      const [prodPromoHours, setProdPromoHours] = useState('24');
      const [prodDesc, setProdDesc] = useState('');
      const [prodImg, setProdImg] = useState('');
      const [isCompressing, setIsCompressing] = useState(false);

      const [selectedQtyMap, setSelectedQtyMap] = useState({});

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsCompressing(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const MAX_HEIGHT = 500;
            let width = img.width, height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setProdImg(canvas.toDataURL('image/jpeg', 0.7));
            setIsCompressing(false);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const [cart, setCart] = useState([]);
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [custCoords, setCustCoords] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      const [isGettingLocation, setIsGettingLocation] = useState(false);
      const [lastOrderId, setLastOrderId] = useState(null);

      const handleGetLocationGPS = () => {
        if (!navigator.geolocation) { alert("Tu navegador no soporta geolocalización."); return; }
        setIsGettingLocation(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            setCustCoords({ lat, lng });
            setCustAddress(`📍 GPS exacto (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
            setIsGettingLocation(false);
            alert("¡Ubicación GPS obtenida!");
          },
          () => { setIsGettingLocation(false); alert("No se pudo obtener el GPS."); },
          { enableHighAccuracy: true }
        );
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'Aithana2411') setIsAdminLogged(true);
        else alert("Contraseña incorrecta");
      };

      const handleCreateStore = async (e) => {
        e.preventDefault();
        try {
          await db.collection('stores').add({
            name: newStoreName, address: newStoreAddress, phone: newStorePhone,
            alias: newStoreAlias, titular: newStoreTitular, hours: newStoreHours || '08:00 a 23:00 hs',
            isOpen: true, isSuspended: false, user: newStoreUser, pass: newStorePass,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewStoreName(''); setNewStoreAddress(''); setNewStorePhone(''); setNewStoreAlias(''); setNewStoreTitular(''); setNewStoreUser(''); setNewStorePass('');
          alert("Comercio registrado con éxito.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleToggleStoreSuspension = async (storeId, currentStatus) => {
        try { await db.collection('stores').doc(storeId).update({ isSuspended: !currentStatus }); alert("Estado actualizado."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleDeleteStore = async (storeId, storeName) => {
        if (confirm(`¿Eliminar comercio "${storeName}"?`)) {
          try { await db.collection('stores').doc(storeId).delete(); alert("Comercio eliminado."); } 
          catch (err) { alert("Error: " + err.message); }
        }
      };

      const handleCreateCadete = async (e) => {
        e.preventDefault();
        try {
          await db.collection('cadetes').add({
            name: newCadeteName, phone: newCadetePhone, vehicle: newCadeteVehicle,
            user: newCadeteUser, pass: newCadetePass, balance: 0, isOnline: true, isSuspended: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewCadeteName(''); setNewCadetePhone(''); setNewCadeteUser(''); setNewCadetePass('');
          alert("Cadete creado con éxito.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleToggleCadeteSuspension = async (cadeteId, currentStatus) => {
        try { await db.collection('cadetes').doc(cadeteId).update({ isSuspended: !currentStatus }); alert("Estado actualizado."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleDeleteCadete = async (cadeteId, cadeteName) => {
        if (confirm(`¿Eliminar cadete "${cadeteName}"?`)) {
          try { await db.collection('cadetes').doc(cadeteId).delete(); alert("Cadete eliminado."); } 
          catch (err) { alert("Error: " + err.message); }
        }
      };

      const handlePublishAnnouncement = async (e) => {
        e.preventDefault();
        try {
          await db.collection('config').doc('announcement').set({ text: announcementInput });
          setAnnouncementInput(''); alert("Anuncio publicado.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleClearAnnouncement = async () => {
        try { await db.collection('config').doc('announcement').set({ text: '' }); alert("Anuncio eliminado."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleRechargeBalance = async (e) => {
        e.preventDefault();
        const amount = Number(rechargeAmount);
        if (!selectedCadeteId || amount <= 0) return;
        const cadeteDoc = cadetes.find(c => c.id === selectedCadeteId);
        if (!cadeteDoc) return;
        try {
          await db.collection('cadetes').doc(selectedCadeteId).update({ balance: (Number(cadeteDoc.balance) || 0) + amount });
          setRechargeAmount(''); alert("¡Saldo acreditado correctamente!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleResetStoreCommission = async (storeId, storeName) => {
        if (confirm(`¿Saldar comisiones de "${storeName}" a $0?`)) {
          try {
            const batch = db.batch();
            const storeOrders = orders.filter(o => {
              const hasStore = o.storeId === storeId || (o.storesInvolved && o.storesInvolved.includes(storeId));
              return hasStore && o.status === 'entregado' && !o.storeSettled;
            });
            if (storeOrders.length === 0) { alert("No hay comisiones pendientes."); return; }
            storeOrders.forEach(o => batch.update(db.collection('orders').doc(o.id), { storeSettled: true }));
            await batch.commit(); alert(`Comisión de "${storeName}" saldada.`);
          } catch (err) { alert("Error: " + err.message); }
        }
      };

      const handleStoreLogin = (e) => {
        e.preventDefault();
        const found = stores.find(s => s.user === loginUser && s.pass === loginPass);
        if (found) {
          if (found.isSuspended) { alert("⚠️ Comercio suspendido."); return; }
          setLoggedStore(found);
        } else { alert("Usuario o clave incorrectos"); }
      };

      const toggleStoreOpenStatus = async () => {
        if (!loggedStore) return;
        const updatedStatus = !loggedStore.isOpen;
        try {
          await db.collection('stores').doc(loggedStore.id).update({ isOpen: updatedStatus });
          setLoggedStore({ ...loggedStore, isOpen: updatedStatus });
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!loggedStore || isCompressing) return;
        let promoExpiresAt = prodIsPromo ? Date.now() + ((Number(prodPromoHours) || 24) * 3600000) : null;
        try {
          await db.collection('products').add({
            storeId: loggedStore.id, name: prodName, price: Number(prodPrice) || 0,
            unit: prodUnit || 'Unidad', category: prodCategory || 'General',
            isPromo: prodIsPromo, promoExpiresAt, description: prodDesc,
            image: prodImg || 'https://via.placeholder.com/150',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setProdName(''); setProdPrice(''); setProdDesc(''); setProdIsPromo(false); setProdImg('');
          alert("Producto guardado.");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleDeleteProduct = async (id, name) => {
        if (confirm(`¿Eliminar "${name}"?`)) {
          try { await db.collection('products').doc(id).delete(); alert("Eliminado."); } 
          catch (err) { alert("Error: " + err.message); }
        }
      };

      const handleCadeteLogin = (e) => {
        e.preventDefault();
        const found = cadetes.find(c => c.user === loginUser && c.pass === loginPass);
        if (found) {
          if (found.isSuspended) { alert("⚠️ Cuenta suspendida."); return; }
          setLoggedCadete(found);
        } else { alert("Usuario o clave incorrectos"); }
      };

      const toggleCadeteOnlineStatus = async () => {
        if (!loggedCadete) return;
        const updatedStatus = !loggedCadete.isOnline;
        try {
          await db.collection('cadetes').doc(loggedCadete.id).update({ isOnline: updatedStatus });
          setLoggedCadete({ ...loggedCadete, isOnline: updatedStatus });
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleAcceptOrder = async (orderId) => {
        if (!loggedCadete || !loggedCadete.isOnline) { alert("Debes estar en línea."); return; }
        if ((Number(loggedCadete.balance) || 0) < APP_FEE) { alert(`Saldo insuficiente (Mínimo $${APP_FEE}).`); return; }
        try {
          const newBalance = (Number(loggedCadete.balance) || 0) - APP_FEE;
          await db.collection('cadetes').doc(loggedCadete.id).update({ balance: newBalance });
          await db.collection('orders').doc(orderId).update({ status: 'tomado_por_cadete', cadeteId: loggedCadete.id });
          setLoggedCadete({ ...loggedCadete, balance: newBalance });
          alert("¡Envío aceptado!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const handleMarkAsOnTheWay = async (orderId) => {
        try { await db.collection('orders').doc(orderId).update({ status: 'en_camino' }); alert("Pedido en camino."); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleCompleteOrder = async (orderId) => {
        try { await db.collection('orders').doc(orderId).update({ status: 'entregado' }); alert("¡Entregado con éxito!"); } 
        catch (err) { alert("Error: " + err.message); }
      };

      const handleRejectOrder = async (orderId) => {
        if (!loggedCadete) return;
        if (confirm("¿Rechazar envío y recuperar los $" + APP_FEE + "?")) {
          try {
            const newBalance = (Number(loggedCadete.balance) || 0) + APP_FEE;
            await db.collection('cadetes').doc(loggedCadete.id).update({ balance: newBalance });
            await db.collection('orders').doc(orderId).update({ status: 'pendiente', cadeteId: null });
            setLoggedCadete({ ...loggedCadete, balance: newBalance });
            alert("Envío liberado.");
          } catch (err) { alert("Error: " + err.message); }
        }
      };

      const handleSubmitRating = async (orderId) => {
        try {
          await db.collection('orders').doc(orderId).update({ rated: true, ratingStore, ratingCadete });
          alert("¡Gracias por calificar!");
        } catch (err) { alert("Error al calificar: " + err.message); }
      };

      const searchClientHistory = (e) => {
        e.preventDefault();
        if (!clientPhoneInput.trim()) return;
        const found = orders.filter(o => o.customerPhone && o.customerPhone.trim() === clientPhoneInput.trim());
        setClientHistory(found);
      };

      const addToCart = (product, store) => {
        const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
        if (onlineCadetesCount === 0) { alert("⚠️ No hay cadetes en línea."); return; }
        if (!store.isOpen || store.isSuspended) { alert("Negocio cerrado."); return; }

        const qtyToAdd = Number(selectedQtyMap[product.id]) !== undefined ? Number(selectedQtyMap[product.id]) : 1;
        if (qtyToAdd <= 0) { alert("Ingresa una cantidad válida."); return; }

        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + qtyToAdd } : i));
        } else {
          setCart([...cart, { ...product, storeId: store.id, storeName: store.name, storeAddress: store.address, storePhone: store.phone, quantity: qtyToAdd }]);
        }
      };

      const updateCartItemQuantity = (productId, newQty) => {
        const qty = Number(newQty);
        if (qty <= 0) setCart(cart.filter(item => item.id !== productId));
        else setCart(cart.map(item => item.id === productId ? { ...item, quantity: qty } : item));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const uniqueStoresInCart = [...new Set(cart.map(i => i.storeId))].length;
      const calculatedDeliveryFee = BASE_DELIVERY_FEE + (Math.max(0, uniqueStoresInCart - 1) * 500);

      const handleCreateOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        
        const uniqueStoresMap = {};
        cart.forEach(item => {
          if (!uniqueStoresMap[item.storeId]) {
            const storeDoc = stores.find(s => s.id === item.storeId);
            uniqueStoresMap[item.storeId] = {
              storeId: item.storeId, storeName: item.storeName, storeAddress: item.storeAddress,
              storePhone: storeDoc ? storeDoc.phone : '', alias: storeDoc ? storeDoc.alias : '', items: []
            };
          }
          uniqueStoresMap[item.storeId].items.push(item);
        });

        const storesList = Object.values(uniqueStoresMap);
        const storesInvolvedIds = storesList.map(s => s.storeId);
        
        try {
          const docRef = await db.collection('orders').add({
            storesInvolved: storesInvolvedIds, storesList, customerName: custName,
            customerPhone: custPhone, address: custAddress, coords: custCoords || null,
            paymentMethod, items: cart, deliveryFee: calculatedDeliveryFee,
            subtotal: cartSubtotal, total: cartSubtotal + calculatedDeliveryFee,
            status: 'pendiente', cadeteId: null, storeSettled: false, rated: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          setLastOrderId(docRef.id);
          setCart([]); setIsCartOpen(false); setCustName(''); setCustPhone(''); setCustAddress(''); setCustCoords(null);
          alert("¡Pedido registrado con éxito!");
        } catch (err) { alert("Error: " + err.message); }
      };

      const filteredStores = stores.filter(store => {
        if (store.isSuspended) return false;
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;
        const matchesStore = store.name.toLowerCase().includes(query) || (store.address && store.address.toLowerCase().includes(query));
        const storeProds = products.filter(p => p.storeId === store.id);
        const matchesProduct = storeProds.some(p => p.name.toLowerCase().includes(query));
        return matchesStore || matchesProduct;
      });

      const onlineCadetesCount = cadetes.filter(c => c.isOnline && !c.isSuspended).length;
      const promoProducts = products.filter(p => p.isPromo && (!p.promoExpiresAt || currentTime <= p.promoExpiresAt));
      const totalCartItemsCount = cart.reduce((sum, item) => sum + Number(item.quantity), 0);
      const activeLiveOrder = orders.find(o => o.id === lastOrderId);
      const activeCadete = activeLiveOrder ? cadetes.find(c => c.id === activeLiveOrder.cadeteId) : null;

      return (
        <div className={`min-h-screen flex flex-col max-w-md mx-auto shadow-xl relative pb-28 transition-colors duration-200 ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-white text-gray-900'}`}>
          
          <header className="bg-red-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Delivery Multi-Local</p>
            </div>
            <div className="flex items-center gap-2">
              <button 
                onClick={() => setDarkMode(!darkMode)}
                className="bg-red-700 hover:bg-red-800 text-white px-2 py-1 rounded text-xs font-bold shadow">
                {darkMode ? '☀️ Claro' : '🌙 Oscuro'}
              </button>
              <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
            </div>
          </header>

          {globalAnnouncement && currentTab === 'cliente' && (
            <div className="bg-amber-500 text-amber-950 font-bold px-4 py-2 text-xs text-center border-b border-amber-600 flex items-center justify-center gap-2">
              <span>📢</span> <span>{globalAnnouncement}</span>
            </div>
          )}

          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          <main className="flex-1 p-4 overflow-y-auto">

            {/* 1. VISTA CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-4">
                
                {activeLiveOrder && activeLiveOrder.status !== 'entregado' && activeLiveOrder.status !== 'cancelado_por_tiempo' && (
                  <div className={`p-4 rounded-xl border-2 text-center space-y-3 shadow-lg ${activeLiveOrder.status === 'en_camino' ? 'bg-green-50 border-green-500 text-gray-900 animate-pulse' : 'bg-orange-50 border-orange-400 text-gray-900'}`}>

                                  value={currentQty} 
                                  onChange={(e) => setSelectedQtyMap({ ...selectedQtyMap, [prod.id]: e.target.value })}

                                <span className="text-[10px]">{unitLabel}</span>

                            </div>

                            <div className="text-right flex flex-col items-end gap-1">
                              <p className="text-xs font-extrabold">

                                onClick={() => addToCart({
                                  ...prod,
                                  quantity: unitLabel === '100g' ? (Number(currentQty) / 100) : Number(currentQty)

                                className="text-xs px-2.5 py-1.5 rounded font-bold bg-red-600 text-white shadow disabled:bg-gray-300">

                      </div>
                    </button>

                            <div className="flex-1">
                              <p className="font-bold">{item.name} ({item.unit === '100g' ? `${item.quantity * 100}g` : `${item.quantity} ${item.unit || 'Unid.'}`})</p>
                              <p className="text-[10px] text-red-600 font-bold">🏪 {item.storeName}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="font-extrabold text-red-600">${Math.round(item.price * item.quantity)}</span>

                            </div>

                          <span className="font-bold">${Math.round(cartSubtotal)}</span>
                        </div>
                        <div className="flex justify-between">
                          <span>Envío ({uniqueStoresInCart} paradas):</span>
                          <span className="font-bold">${calculatedDeliveryFee}</span>
                        </div>
                        <div className="flex justify-between font-extrabold text-sm pt-1 border-t">
                          <span>TOTAL GENERAL:</span>
                          <span className="text-red-600">${Math.round(cartSubtotal + calculatedDeliveryFee)}</span>

                        <div className="flex gap-2">

                            <option value="Transferencia">💳 Transferencia (Productos al comercio + Envío al cadete)</option>
                            <option value="Mercado Pago">📱 Mercado Pago / QR (Pago completo anticipado)</option>
                          </select>
                        </div>

                        <button type="submit" className="w-full bg-red-600 text-white py-2.5 rounded font-bold text-xs shadow hover:bg-red-700">
                          Confirmar Pedido 🚀
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </div>

                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : ''}`} />

                      <div>

                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : ''}`} />

                    </div>

                      <span>Estado:</span>
                      <button onClick={toggleCadeteOnlineStatus} className={`px-3 py-1 rounded text-white font-bold ${loggedCadete.isOnline ? 'bg-green-600' : 'bg-red-600'}`}>

                    </div>

                    <div className="space-y-2">
                      <h3 className="font-bold">Envíos Disponibles:</h3>
                      {orders.filter(o => o.status === 'pendiente' || (o.cadeteId === loggedCadete.id && o.status !== 'entregado')).map(o => (

                          <div className="flex justify-between font-bold">
                            <span>📦 Pedido #{o.id.slice(-4).toUpperCase()}</span>
                            <span className="text-green-600">Ganancia Envío: ${Math.round(o.deliveryFee || BASE_DELIVERY_FEE)}</span>

                            </button>

                            <button onClick={()=>handleCompleteOrder(o.id)} className="w-full bg-orange-500 text-white py-2 rounded font-bold">

                  <form onSubmit={handleAdminLogin} className={`border p-4 rounded space-y-3 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-gray-50'}`}>
                    <h2 className="font-bold text-sm">Acceso Administrador</h2>
                    <input required type="password" placeholder="Contraseña Admin" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : ''}`} />
                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-gray-800 text-white p-2 rounded">
                      <span className="font-bold">Panel Administrador</span>
                      <button onClick={()=>setIsAdminLogged(false)} className="text-red-300 font-bold underline">Salir</button>
                    </div>

                    <form onSubmit={handleCreateStore} className={`border p-3 rounded space-y-2 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-red-50'}`}>
                      <h3 className="font-bold text-red-500 text-sm">🏪 Registrar Comercio</h3>
                      <input required placeholder="Nombre" value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <input required placeholder="Usuario" value={newStoreUser} onChange={e=>setNewStoreUser(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <input required type="password" placeholder="Contraseña" value={newStorePass} onChange={e=>setNewStorePass(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Crear Comercio</button>
                    </form>

                    <form onSubmit={handleCreateCadete} className={`border p-3 rounded space-y-2 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-blue-50'}`}>
                      <h3 className="font-bold text-blue-500 text-sm">🛵 Registrar Cadete</h3>
                      <input required placeholder="Nombre" value={newCadeteName} onChange={e=>setNewCadeteName(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <input required placeholder="Usuario" value={newCadeteUser} onChange={e=>setNewCadeteUser(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <input required type="password" placeholder="Contraseña" value={newCadetePass} onChange={e=>setNewCadetePass(e.target.value)} className={`w-full p-2 border rounded ${darkMode ? 'bg-gray-700 text-white' : 'bg-white'}`} />
                      <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">Crear Cadete</button>
                    </form>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
