<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Catuna</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navegación principal
      const [currentTab, setCurrentTab] = useState('cliente'); // cliente, comercio, cadete, admin

      // Base de datos local (Inicia vacía)
      const [stores, setStores] = useState(() => {
        const saved = localStorage.getItem('catuna_stores');
        return saved ? JSON.parse(saved) : [];
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('catuna_products');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('catuna_orders');
        return saved ? JSON.parse(saved) : [];
      });

      // Guardar cambios en LocalStorage para no perder datos al recargar
      useEffect(() => { localStorage.setItem('catuna_stores', JSON.stringify(stores)); }, [stores]);
      useEffect(() => { localStorage.setItem('catuna_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('catuna_orders', JSON.stringify(orders)); }, [orders]);

      // ESTADOS ADMIN
      const [adminPass, setAdminPass] = useState('');
      const [isAdminLogged, setIsAdminLogged] = useState(false);
      const [newStoreName, setNewStoreName] = useState('');
      const [newStoreAddress, setNewStoreAddress] = useState('');
      const [newStoreUser, setNewStoreUser] = useState('');
      const [newStorePass, setNewStorePass] = useState('');

      // ESTADOS LOGIN COMERCIO
      const [storeUser, setStoreUser] = useState('');
      const [storePass, setStorePass] = useState('');
      const [loggedStore, setLoggedStore] = useState(null);

      // ESTADO NUEVO PRODUCTO (Por el Comercio)
      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [prodDesc, setProdDesc] = useState('');
      const [prodImg, setProdImg] = useState('');

      // ESTADO CARRITO CLIENTE
      const [cart, setCart] = useState([]);
      const [selectedStore, setSelectedStore] = useState(null);
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');

      // ACCIONES ADMIN
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'admin123') { // CONTRASEÑA DE ADMIN
          setIsAdminLogged(true);
        } else {
          alert("Contraseña de Administrador incorrecta");
        }
      };

      const handleCreateStore = (e) => {
        e.preventDefault();
        const store = {
          id: Date.now(),
          name: newStoreName,
          address: newStoreAddress,
          user: newStoreUser,
          pass: newStorePass
        };
        setStores([...stores, store]);
        setNewStoreName(''); setNewStoreAddress(''); setNewStoreUser(''); setNewStorePass('');
        alert("¡Comercio registrado con éxito! Ya puedes entregarle las credenciales.");
      };

      const handleDeleteStore = (id) => {
        if (confirm("¿Estás seguro de eliminar este comercio?")) {
          setStores(stores.filter(s => s.id !== id));
          setProducts(products.filter(p => p.storeId !== id));
        }
      };

      // ACCIONES COMERCIO
      const handleStoreLogin = (e) => {
        e.preventDefault();
        const found = stores.find(s => s.user === storeUser && s.pass === storePass);
        if (found) {
          setLoggedStore(found);
        } else {
          alert("Usuario o contraseña incorrectos");
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!loggedStore) return;
        const newProd = {
          id: Date.now(),
          storeId: loggedStore.id,
          name: prodName,
          price: Number(prodPrice),
          description: prodDesc,
          image: prodImg || 'https://via.placeholder.com/150'
        };
        setProducts([...products, newProd]);
        setProdName(''); setProdPrice(''); setProdDesc(''); setProdImg('');
        alert("Producto agregado al menú");
      };

      const handleDeleteProduct = (id) => {
        setProducts(products.filter(p => p.id !== id));
      };

      // ACCIONES CLIENTE
      const addToCart = (product, store) => {
        if (selectedStore && selectedStore.id !== store.id) {
          if (!confirm("Solo puedes pedir a un negocio por pedido. ¿Deseas reiniciar el carrito?")) return;
          setCart([]);
        }
        setSelectedStore(store);
        const exists = cart.find(i => i.id === product.id);
        if (exists) {
          setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i));
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
      };

      const handleCreateOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const newOrder = {
          id: Date.now(),
          storeId: selectedStore.id,
          storeName: selectedStore.name,
          customerName: custName,
          customerPhone: custPhone,
          address: custAddress,
          items: cart,
          total: subtotal + 1200, // $1200 costo de envío por defecto
          status: 'pendiente'
        };
        setOrders([newOrder, ...orders]);
        setCart([]);
        alert("¡Pedido realizado con éxito!");
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
          {/* Header */}
          <header className="bg-red-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Delivery Local</p>
            </div>
            <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
          </header>

          {/* Menú de pestañas */}
          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 p-4 pb-20 overflow-y-auto">

            {/* 1. VISTA CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-6">
                {stores.length === 0 ? (
                  <div className="text-center py-10 text-gray-500">
                    <p className="font-bold text-base">Próximamente más comercios</p>
                    <p className="text-xs">Aún no hay locales registrados en la plataforma.</p>
                  </div>
                ) : (
                  stores.map(store => (
                    <div key={store.id} className="border rounded-lg p-3 bg-gray-50 shadow-sm space-y-3">
                      <div>
                        <h3 className="font-bold text-gray-800 text-base">{store.name}</h3>
                        <p className="text-xs text-gray-500">{store.address}</p>
                      </div>

                      {/* Menú del comercio */}
                      <div className="space-y-2">
                        {products.filter(p => p.storeId === store.id).map(prod => (
                          <div key={prod.id} className="flex gap-3 bg-white p-2 rounded border items-center">
                            <img src={prod.image} className="w-16 h-16 object-cover rounded bg-gray-200" alt={prod.name} />
                            <div className="flex-1">
                              <p className="font-bold text-sm text-gray-800">{prod.name}</p>
                              <p className="text-xs text-gray-500">{prod.description}</p>
                              <p className="text-xs font-bold text-red-600 mt-1">${prod.price}</p>
                            </div>
                            <button onClick={() => addToCart(prod, store)} className="bg-red-600 text-white text-xs px-2.5 py-1.5 rounded font-bold">
                              + Pedir
                            </button>
                          </div>
                        ))}
                        {products.filter(p => p.storeId === store.id).length === 0 && (
                          <p className="text-xs text-gray-400 italic">Cargando menú...</p>
                        )}
                      </div>
                    </div>
                  ))
                )}

                {/* Carrito Flotante */}
                {cart.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t-2 border-red-600 p-4 shadow-2xl z-50">
                    <h3 className="font-bold text-sm mb-2 text-gray-800">Pedido para {selectedStore?.name}</h3>
                    <div className="max-h-24 overflow-y-auto space-y-1 mb-2 text-xs border-b pb-2">
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between">
                          <span>{item.quantity}x {item.name}</span>
                          <span>${item.price * item.quantity}</span>
                        </div>
                      ))}
                    </div>
                    <form onSubmit={handleCreateOrder} className="space-y-2">
                      <input required placeholder="Tu Nombre" value={custName} onChange={e=>setCustName(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <input required placeholder="Teléfono WhatsApp" value={custPhone} onChange={e=>setCustPhone(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <input required placeholder="Dirección de Entrega" value={custAddress} onChange={e=>setCustAddress(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold text-xs">
                        Confirmar Pedido Total: (${cart.reduce((s,i)=>s+(i.price*i.quantity),0) + 1200})
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* 2. VISTA COMERCIO */}
            {currentTab === 'comercio' && (
              <div className="space-y-4">
                {!loggedStore ? (
                  <form onSubmit={handleStoreLogin} className="border p-4 rounded bg-gray-50 space-y-3 text-xs">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Comercios</h2>
                    <p className="text-gray-500">Ingresa las credenciales proporcionadas por la administración.</p>
                    <input required placeholder="Usuario" value={storeUser} onChange={e=>setStoreUser(e.target.value)} className="w-full p-2 border rounded" />
                    <input required type="password" placeholder="Contraseña" value={storePass} onChange={e=>setStorePass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Iniciar Sesión</button>
                  </form>
                ) : (
                  <div className="space-y-5 text-xs">
                    <div className="flex justify-between items-center bg-gray-100 p-2 rounded">
                      <span className="font-bold text-sm text-gray-800">{loggedStore.name}</span>
                      <button onClick={()=>setLoggedStore(null)} className="text-red-600 text-xs underline font-bold">Cerrar Sesión</button>
                    </div>

                    {/* Agregar Producto */}
                    <form onSubmit={handleAddProduct} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Cargar Nuevo Producto / Plato</h3>
                      <input required placeholder="Nombre del producto (Ej. Pizza Muzzarella)" value={prodName} onChange={e=>setProdName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="number" placeholder="Precio ($)" value={prodPrice} onChange={e=>setProdPrice(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="Descripción breve" value={prodDesc} onChange={e=>setProdDesc(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="URL de la Foto / Imagen (Opcional)" value={prodImg} onChange={e=>setProdImg(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-green-600 text-white py-2 rounded font-bold">Guardar en Mi Menú</button>
                    </form>

                    {/* Menú actual del comercio */}
                    <div className="space-y-2">
                      <h3 className="font-bold text-gray-800">Mi Menú Publicado:</h3>
                      {products.filter(p => p.storeId === loggedStore.id).map(p => (
                        <div key={p.id} className="flex justify-between items-center border p-2 rounded">
                          <div className="flex items-center gap-2">
                            <img src={p.image} className="w-10 h-10 object-cover rounded bg-gray-200" />
                            <div>
                              <p className="font-bold">{p.name}</p>
                              <p className="text-gray-500">${p.price}</p>
                            </div>
                          </div>
                          <button onClick={()=>handleDeleteProduct(p.id)} className="text-red-600 font-bold px-2 py-1">Eliminar</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. VISTA CADETE */}
            {currentTab === 'cadete' && (
              <div className="space-y-3 text-xs">
                <h2 className="font-bold text-sm text-gray-800 border-b pb-2">Pedidos Solicitados</h2>
                {orders.length === 0 ? <p className="text-gray-500">No hay pedidos pendientes.</p> : null}
                {orders.map(o => (
                  <div key={o.id} className="border p-3 rounded bg-gray-50 space-y-1">
                    <p className="font-bold text-red-600">{o.storeName}</p>
                    <p><strong>Cliente:</strong> {o.customerName} ({o.customerPhone})</p>
                    <p><strong>Entrega en:</strong> {o.address}</p>
                    <p className="font-bold text-gray-800">Total a cobrar: ${o.total}</p>
                  </div>
                ))}
              </div>
            )}

            {/* 4. VISTA ADMIN (PROTEGIDA) */}
            {currentTab === 'admin' && (
              <div className="space-y-4 text-xs">
                {!isAdminLogged ? (
                  <form onSubmit={handleAdminLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Administrador</h2>
                    <p className="text-gray-500">Ingresa la clave maestra para administrar el sistema.</p>
                    <input required type="password" placeholder="Contraseña de Admin" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded font-bold">Entrar como Admin</button>
                  </form>
                ) : (
                  <div className="space-y-5">
                    <div className="flex justify-between items-center bg-gray-800 text-white p-2 rounded">
                      <span className="font-bold">Panel de Administración</span>
                      <button onClick={()=>setIsAdminLogged(false)} className="text-red-300 text-xs underline">Salir</button>
                    </div>

                    {/* Registrar Nuevo Comercio */}
                    <form onSubmit={handleCreateStore} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Registrar Nuevo Comercio</h3>
                      <input required placeholder="Nombre del Negocio (Ej. Pizzería Don Julio)" value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required placeholder="Dirección del Local" value={newStoreAddress} onChange={e=>setNewStoreAddress(e.target.value)} className="w-full p-2 border rounded" />
                      <div className="grid grid-cols-2 gap-2">
                        <input required placeholder="Usuario para el local" value={newStoreUser} onChange={e=>setNewStoreUser(e.target.value)} className="w-full p-2 border rounded" />
                        <input required placeholder="Contraseña" value={newStorePass} onChange={e=>setNewStorePass(e.target.value)} className="w-full p-2 border rounded" />
                      </div>
                      <button type="submit" className="w-full bg-green-600 text-white py-2 rounded font-bold">Crear Cuenta de Comercio</button>
                    </form>

                    {/* Lista de Comercios Registrados */}
                    <div className="space-y-2">
                      <h3 className="font-bold text-gray-800">Comercios Activos ({stores.length}):</h3>
                      {stores.map(s => (
                        <div key={s.id} className="border p-2 rounded bg-white flex justify-between items-center">
                          <div>
                            <p className="font-bold">{s.name}</p>
                            <p className="text-gray-500">Usuario: {s.user} | Clave: {s.pass}</p>
                          </div>
                          <button onClick={()=>handleDeleteStore(s.id)} className="text-red-600 font-bold px-2 py-1">Dar de Baja</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
