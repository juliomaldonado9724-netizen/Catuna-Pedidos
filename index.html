<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Catuna</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState('cliente');

      // DATOS DE PAGO DEL ADMIN (Para recargas de cadetes)
      const ADMIN_PAYMENT_INFO = {
        alias: "Juliomaldonado132",
        titular: "Julio Nicolás Maldonado",
        banco: "Mercado Pago"
      };

      const STORE_COMMISSION_PERCENT = 0.10; // 10% comisión para el comercio
      const APP_FEE = 300; // Tarifa app para cadetes (tu comisión)
      const DELIVERY_FEE = 1500; // Envío total ($1200 para el cadete + $300 para la app)

      // Base de datos LocalStorage
      const [stores, setStores] = useState(() => {
        const saved = localStorage.getItem('catuna_stores');
        return saved ? JSON.parse(saved) : [];
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('catuna_products');
        return saved ? JSON.parse(saved) : [];
      });

      const [cadetes, setCadetes] = useState(() => {
        const saved = localStorage.getItem('catuna_cadetes');
        return saved ? JSON.parse(saved) : [];
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('catuna_orders');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => { localStorage.setItem('catuna_stores', JSON.stringify(stores)); }, [stores]);
      useEffect(() => { localStorage.setItem('catuna_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('catuna_cadetes', JSON.stringify(cadetes)); }, [cadetes]);
      useEffect(() => { localStorage.setItem('catuna_orders', JSON.stringify(orders)); }, [orders]);

      // ESTADOS ADMIN
      const [adminPass, setAdminPass] = useState('');
      const [isAdminLogged, setIsAdminLogged] = useState(false);
      
      const [newStoreName, setNewStoreName] = useState('');
      const [newStoreAddress, setNewStoreAddress] = useState('');
      const [newStorePhone, setNewStorePhone] = useState('');
      const [newStoreAlias, setNewStoreAlias] = useState('');
      const [newStoreTitular, setNewStoreTitular] = useState('');
      const [newStoreHours, setNewStoreHours] = useState('20:00 a 00:00 hs');
      const [newStoreUser, setNewStoreUser] = useState('');
      const [newStorePass, setNewStorePass] = useState('');

      const [newCadeteName, setNewCadeteName] = useState('');
      const [newCadetePhone, setNewCadetePhone] = useState('');
      const [newCadeteUser, setNewCadeteUser] = useState('');
      const [newCadetePass, setNewCadetePass] = useState('');
      const [newCadeteVehicle, setNewCadeteVehicle] = useState('Moto');

      const [selectedCadeteId, setSelectedCadeteId] = useState('');
      const [rechargeAmount, setRechargeAmount] = useState('');

      // ESTADOS LOGIN COMERCIO / CADETE
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loggedStore, setLoggedStore] = useState(null);
      const [loggedCadete, setLoggedCadete] = useState(null);

      // ESTADO NUEVO PRODUCTO
      const [prodName, setProdName] = useState('');
      const [prodPrice, setProdPrice] = useState('');
      const [prodDesc, setProdDesc] = useState('');
      const [prodImg, setProdImg] = useState('');

      // ESTADO CARRITO CLIENTE
      const [cart, setCart] = useState([]);
      const [selectedStore, setSelectedStore] = useState(null);
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [lastOrderSent, setLastOrderSent] = useState(null);

      // --- ACCIONES ADMIN ---
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'Aithana2411') setIsAdminLogged(true);
        else alert("Contraseña de Admin incorrecta");
      };

      const handleCreateStore = (e) => {
        e.preventDefault();
        const store = { 
          id: Date.now(), 
          name: newStoreName, 
          address: newStoreAddress, 
          phone: newStorePhone,
          alias: newStoreAlias,
          titular: newStoreTitular,
          hours: newStoreHours || '20:00 a 00:00 hs',
          isOpen: true,
          user: newStoreUser, 
          pass: newStorePass 
        };
        setStores([...stores, store]);
        setNewStoreName(''); setNewStoreAddress(''); setNewStorePhone(''); setNewStoreAlias(''); setNewStoreTitular(''); setNewStoreHours(''); setNewStoreUser(''); setNewStorePass('');
        alert("Comercio registrado con éxito.");
      };

      const handleCreateCadete = (e) => {
        e.preventDefault();
        const cadete = { id: Date.now(), name: newCadeteName, phone: newCadetePhone, vehicle: newCadeteVehicle, user: newCadeteUser, pass: newCadetePass, balance: 0 };
        setCadetes([...cadetes, cadete]);
        setNewCadeteName(''); setNewCadetePhone(''); setNewCadeteUser(''); setNewCadetePass('');
        alert("Cadete creado exitosamente.");
      };

      const handleRechargeBalance = (e) => {
        e.preventDefault();
        const amount = Number(rechargeAmount);
        if (!selectedCadeteId || amount <= 0) return;
        setCadetes(cadetes.map(c => c.id === Number(selectedCadeteId) ? { ...c, balance: c.balance + amount } : c));
        setRechargeAmount('');
        alert("¡Saldo acreditado correctamente!");
      };

      const handleResetStoreCommission = (storeId) => {
        if (confirm("¿Confirmas que el comercio abonó la comisión acumulada? Esto reiniciará el historial de ventas pagadas.")) {
          setOrders(orders.map(o => o.storeId === storeId ? { ...o, storeSettled: true } : o));
          alert("Comisión cobrada y cuentas saldadas.");
        }
      };

      // --- ACCIONES COMERCIO ---
      const handleStoreLogin = (e) => {
        e.preventDefault();
        const found = stores.find(s => s.user === loginUser && s.pass === loginPass);
        if (found) setLoggedStore(found);
        else alert("Usuario o clave incorrectos");
      };

      const toggleStoreOpenStatus = () => {
        if (!loggedStore) return;
        const updatedStatus = !loggedStore.isOpen;
        const updatedStore = { ...loggedStore, isOpen: updatedStatus };
        setLoggedStore(updatedStore);
        setStores(stores.map(s => s.id === loggedStore.id ? updatedStore : s));
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!loggedStore) return;
        const newProd = { id: Date.now(), storeId: loggedStore.id, name: prodName, price: Number(prodPrice), description: prodDesc, image: prodImg || 'https://via.placeholder.com/150' };
        setProducts([...products, newProd]);
        setProdName(''); setProdPrice(''); setProdDesc(''); setProdImg('');
        alert("Producto guardado");
      };

      const handleDeleteProduct = (id) => {
        setProducts(products.filter(p => p.id !== id));
      };

      // --- ACCIONES CADETE ---
      const handleCadeteLogin = (e) => {
        e.preventDefault();
        const found = cadetes.find(c => c.user === loginUser && c.pass === loginPass);
        if (found) setLoggedCadete(found);
        else alert("Usuario o clave incorrectos");
      };

      const handleAcceptOrder = (orderId) => {
        if (!loggedCadete) return;
        if (loggedCadete.balance < APP_FEE) {
          alert(`Saldo insuficiente. Necesitas al menos $${APP_FEE} para tomar un viaje. Recarga saldo transfiriendo al Admin.`);
          return;
        }

        const updatedBalance = loggedCadete.balance - APP_FEE;
        setCadetes(cadetes.map(c => c.id === loggedCadete.id ? { ...c, balance: updatedBalance } : c));
        setLoggedCadete({ ...loggedCadete, balance: updatedBalance });

        setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'en_camino', cadeteId: loggedCadete.id } : o));
        alert("¡Viaje aceptado! Se descontaron $" + APP_FEE + " de tu saldo de la app.");
      };

      const handleCompleteOrder = (orderId) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: 'entregado' } : o));
        alert("¡Pedido entregado!");
      };

      // --- ACCIONES CLIENTE ---
      const addToCart = (product, store) => {
        if (!store.isOpen) {
          alert("Este local está cerrado actualmente.");
          return;
        }
        if (selectedStore && selectedStore.id !== store.id) {
          if (!confirm("Solo puedes pedir a un negocio a la vez. ¿Deseas reiniciar el carrito?")) return;
          setCart([]);
        }
        setSelectedStore(store);
        const exists = cart.find(i => i.id === product.id);
        if (exists) setCart(cart.map(i => i.id === product.id ? { ...i, quantity: i.quantity + 1 } : i));
        else setCart([...cart, { ...product, quantity: 1 }]);
      };

      const handleCreateOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const newOrder = {
          id: Date.now(),
          storeId: selectedStore.id,
          storeName: selectedStore.name,
          storeAddress: selectedStore.address,
          storePhone: selectedStore.phone,
          customerName: custName,
          customerPhone: custPhone,
          address: custAddress,
          items: cart,
          deliveryFee: DELIVERY_FEE,
          subtotal,
          total: subtotal + DELIVERY_FEE,
          status: 'pendiente',
          cadeteId: null,
          storeSettled: false
        };
        setOrders([newOrder, ...orders]);

        // GENERAR MENSAJE DE WHATSAPP PARA EL COMERCIO
        const itemsList = cart.map(i => `• ${i.quantity}x ${i.name} ($${i.price * i.quantity})`).join('%0A');
        const msg = `🔔 *NUEVO PEDIDO - Catuna Pedidos*%0A%0A*Cliente:* ${encodeURIComponent(custName)}%0A*Tel:* ${encodeURIComponent(custPhone)}%0A*Dirección:* ${encodeURIComponent(custAddress)}%0A%0A*Productos:*%0A${itemsList}%0A%0A*Subtotal Comida:* $${subtotal}%0A*Envío:* $${DELIVERY_FEE}%0A*TOTAL A PAGAR:* $${subtotal + DELIVERY_FEE}`;
        
        if (selectedStore.phone) {
          window.open(`https://wa.me/549${selectedStore.phone}?text=${msg}`, '_blank');
        }

        setLastOrderSent({ storePhone: selectedStore.phone, storeName: selectedStore.name, total: subtotal + DELIVERY_FEE });
        setCart([]);
        setCustName(''); setCustPhone(''); setCustAddress('');
        alert("¡Pedido enviado con éxito! Se notificó al comercio por WhatsApp.");
      };

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-xl">
          <header className="bg-red-600 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow">
            <div>
              <h1 className="text-xl font-bold">Catuna Pedidos</h1>
              <p className="text-xs text-red-100">Delivery Local</p>
            </div>
            <span className="text-xs bg-red-700 px-2 py-1 rounded font-bold uppercase">{currentTab}</span>
          </header>

          <nav className="bg-gray-800 text-white text-xs flex justify-around p-2">
            <button onClick={() => setCurrentTab('cliente')} className={`py-1 px-3 rounded ${currentTab==='cliente'?'bg-red-600 font-bold':''}`}>Cliente</button>
            <button onClick={() => setCurrentTab('comercio')} className={`py-1 px-3 rounded ${currentTab==='comercio'?'bg-red-600 font-bold':''}`}>Comercio</button>
            <button onClick={() => setCurrentTab('cadete')} className={`py-1 px-3 rounded ${currentTab==='cadete'?'bg-red-600 font-bold':''}`}>Cadete</button>
            <button onClick={() => setCurrentTab('admin')} className={`py-1 px-3 rounded ${currentTab==='admin'?'bg-red-600 font-bold':''}`}>🔒 Admin</button>
          </nav>

          <main className="flex-1 p-4 pb-20 overflow-y-auto">

            {/* 1. VISTA CLIENTE */}
            {currentTab === 'cliente' && (
              <div className="space-y-6">
                {lastOrderSent && (
                  <div className="bg-green-50 border-2 border-green-500 p-3 rounded-lg text-center space-y-2 shadow-md">
                    <p className="font-bold text-green-900 text-sm">✅ ¡Pedido realizado a {lastOrderSent.storeName}!</p>
                    <p className="text-xs text-gray-600">Si pagaste por transferencia, toca el botón para enviar el comprobante directamente al WhatsApp del local.</p>
                    <a 
                      href={`https://wa.me/549${lastOrderSent.storePhone}?text=Hola,%20te%20envío%20el%20comprobante%20de%20mi%20pedido%20por%20$${lastOrderSent.total}%20en%20Catuna%20Pedidos:`}
                      target="_blank"
                      className="block w-full bg-green-600 text-white font-bold py-2 rounded text-xs shadow hover:bg-green-700">
                      💬 Enviar Comprobante por WhatsApp
                    </a>
                    <button onClick={() => setLastOrderSent(null)} className="text-[11px] text-gray-500 underline">Cerrar aviso</button>
                  </div>
                )}

                {stores.length === 0 ? (
                  <div className="text-center py-10 text-gray-500">
                    <p className="font-bold text-base">Próximamente más comercios</p>
                    <p className="text-xs">Aún no hay locales registrados en la plataforma.</p>
                  </div>
                ) : (
                  stores.map(store => (
                    <div key={store.id} className="border rounded-lg p-3 bg-gray-50 shadow-sm space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-bold text-gray-800 text-base">{store.name}</h3>
                          <p className="text-xs text-gray-500">{store.address}</p>
                          <p className="text-[11px] text-gray-400">🕒 Horario: {store.hours}</p>
                        </div>
                        <span className={`text-[10px] font-bold px-2 py-1 rounded ${store.isOpen ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}`}>
                          {store.isOpen ? '🟢 ABIERTO' : '🔴 CERRADO'}
                        </span>
                      </div>

                      {store.alias && (
                        <div className="bg-amber-50 border border-amber-200 p-2 rounded text-[11px] space-y-0.5">
                          <p className="font-bold text-amber-900">💳 Datos para transferir la comida:</p>
                          <p className="text-gray-700"><strong>Alias:</strong> <span className="font-mono font-bold select-all">{store.alias}</span></p>
                          {store.titular && <p className="text-gray-700"><strong>Titular:</strong> {store.titular}</p>}
                        </div>
                      )}

                      <div className="space-y-2">
                        {products.filter(p => p.storeId === store.id).map(prod => (
                          <div key={prod.id} className="flex gap-3 bg-white p-2 rounded border items-center">
                            <img src={prod.image} className="w-16 h-16 object-cover rounded bg-gray-200" alt={prod.name} />
                            <div className="flex-1">
                              <p className="font-bold text-sm text-gray-800">{prod.name}</p>
                              <p className="text-xs text-gray-500">{prod.description}</p>
                              <p className="text-xs font-bold text-red-600 mt-1">${prod.price}</p>
                            </div>
                            <button 
                              onClick={() => addToCart(prod, store)} 
                              disabled={!store.isOpen}
                              className={`text-xs px-2.5 py-1.5 rounded font-bold ${store.isOpen ? 'bg-red-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>
                              {store.isOpen ? '+ Pedir' : 'Cerrado'}
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))
                )}

                {cart.length > 0 && (
                  <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t-2 border-red-600 p-4 shadow-2xl z-50">
                    <h3 className="font-bold text-sm mb-2 text-gray-800">Pedido para {selectedStore?.name}</h3>
                    <form onSubmit={handleCreateOrder} className="space-y-2">
                      <input required placeholder="Tu Nombre" value={custName} onChange={e=>setCustName(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <input required placeholder="Teléfono WhatsApp (Ej: 3826123456)" value={custPhone} onChange={e=>setCustPhone(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <input required placeholder="Dirección / Referencias de Entrega" value={custAddress} onChange={e=>setCustAddress(e.target.value)} className="w-full text-xs p-1.5 border rounded" />
                      <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold text-xs">
                        Confirmar Pedido Total: (${cart.reduce((s,i)=>s+(i.price*i.quantity),0) + DELIVERY_FEE})
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* 2. VISTA COMERCIO */}
            {currentTab === 'comercio' && (
              <div className="space-y-4">
                {!loggedStore ? (
                  <form onSubmit={handleStoreLogin} className="border p-4 rounded bg-gray-50 space-y-3 text-xs">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Comercio</h2>
                    <input required placeholder="Usuario" value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="w-full p-2 border rounded" />
                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="flex justify-between items-center bg-gray-100 p-2.5 rounded border">
                      <div>
                        <p className="font-bold text-gray-800 text-sm">{loggedStore.name}</p>
                        <p className="text-gray-500 text-[11px]">{loggedStore.hours}</p>
                        {loggedStore.alias && <p className="text-amber-800 font-mono text-[10px]">Alias: {loggedStore.alias}</p>}
                      </div>
                      <button onClick={()=>setLoggedStore(null)} className="text-red-600 font-bold underline">Salir</button>
                    </div>

                    <div className="border p-3 rounded bg-gray-50 flex justify-between items-center">
                      <div>
                        <p className="font-bold text-gray-800">Estado del Local:</p>
                        <p className="text-gray-500 text-[11px]">Cambia el estado para recibir o pausar pedidos.</p>
                      </div>
                      <button 
                        onClick={toggleStoreOpenStatus} 
                        className={`px-3 py-1.5 rounded font-bold text-white shadow ${loggedStore.isOpen ? 'bg-green-600' : 'bg-red-600'}`}>
                        {loggedStore.isOpen ? '🟢 ABIERTO' : '🔴 CERRADO'}
                      </button>
                    </div>

                    <form onSubmit={handleAddProduct} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Cargar Producto al Menú</h3>
                      <input required placeholder="Nombre del plato" value={prodName} onChange={e=>setProdName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="number" placeholder="Precio ($)" value={prodPrice} onChange={e=>setProdPrice(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="Descripción breve" value={prodDesc} onChange={e=>setProdDesc(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="URL de la Foto (Opcional)" value={prodImg} onChange={e=>setProdImg(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-green-600 text-white py-2 rounded font-bold">Guardar Producto</button>
                    </form>

                    <div className="space-y-2">
                      <h3 className="font-bold text-gray-800">Mi Menú Publicado:</h3>
                      {products.filter(p => p.storeId === loggedStore.id).map(p => (
                        <div key={p.id} className="flex justify-between items-center border p-2 rounded bg-white">
                          <div className="flex items-center gap-2">
                            <img src={p.image} className="w-10 h-10 object-cover rounded bg-gray-200" />
                            <div>
                              <p className="font-bold">{p.name}</p>
                              <p className="text-gray-500">${p.price}</p>
                            </div>
                          </div>
                          <button onClick={()=>handleDeleteProduct(p.id)} className="text-red-600 font-bold px-2 py-1">Eliminar</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. VISTA CADETE */}
            {currentTab === 'cadete' && (
              <div className="space-y-4">
                {!loggedCadete ? (
                  <form onSubmit={handleCadeteLogin} className="border p-4 rounded bg-gray-50 space-y-3 text-xs">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Repartidores / Cadetes</h2>
                    <input required placeholder="Usuario Cadete" value={loginUser} onChange={e=>setLoginUser(e.target.value)} className="w-full p-2 border rounded" />
                    <input required type="password" placeholder="Contraseña" value={loginPass} onChange={e=>setLoginPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-red-600 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="bg-gray-800 text-white p-3 rounded flex justify-between items-center shadow">
                      <div>
                        <p className="font-bold text-sm">{loggedCadete.name}</p>
                        <p className="text-gray-300">Vehículo: {loggedCadete.vehicle}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-xs text-gray-400">Saldo App:</p>
                        <p className={`text-base font-bold ${loggedCadete.balance < APP_FEE ? 'text-red-400' : 'text-green-400'}`}>
                          ${loggedCadete.balance}
                        </p>
                      </div>
                    </div>

                    <div className="border p-3 rounded bg-blue-50 border-blue-200 space-y-1">
                      <p className="font-bold text-blue-900">💳 Cargar Crédito / Saldo al Admin:</p>
                      <p className="text-gray-700"><strong>Banco:</strong> {ADMIN_PAYMENT_INFO.banco}</p>
                      <p className="text-gray-700"><strong>Alias:</strong> <span className="bg-white px-1.5 py-0.5 border rounded font-mono font-bold select-all">{ADMIN_PAYMENT_INFO.alias}</span></p>
                      <p className="text-gray-700"><strong>Titular:</strong> {ADMIN_PAYMENT_INFO.titular}</p>
                      <p className="text-gray-500 text-[11px] pt-1">* Realiza la transferencia y avísale al Admin para que te acredite el saldo en la app.</p>
                    </div>

                    {loggedCadete.balance < APP_FEE && (
                      <div className="bg-red-100 border border-red-400 text-red-800 p-2.5 rounded text-center font-bold">
                        ⚠️ Saldo insuficiente para recibir viajes. Transfiere al Alias de arriba y avisa al Admin.
                      </div>
                    )}

                    <h3 className="font-bold text-gray-800 border-b pb-1">Pedidos en Plataforma:</h3>
                    {orders.filter(o => o.status === 'pendiente' || (o.status === 'en_camino' && o.cadeteId === loggedCadete.id)).map(o => (
                      <div key={o.id} className="border p-3 rounded bg-gray-50 space-y-2.5">
                        <div className="flex justify-between font-bold border-b pb-1">
                          <span className="text-red-600">{o.storeName}</span>
                          <span className="text-green-700">Ganancia Envío: $1200</span>
                        </div>
                        <p><strong>Retirar en:</strong> {o.storeAddress}</p>
                        <p><strong>Cliente:</strong> {o.customerName}</p>
                        <p><strong>Dirección:</strong> {o.address}</p>
                        <p className="font-bold text-gray-900 bg-yellow-100 p-1.5 rounded">Cobrar al Cliente in mano: ${o.total}</p>

                        <div className="grid grid-cols-2 gap-2 pt-1">
                          <a 
                            href={`https://wa.me/549${o.customerPhone}?text=Hola%20${encodeURIComponent(o.customerName)},%20soy%20el%20cadete%20de%20Catuna%20Pedidos.%20Voy%20en%20camino%20con%20tu%20pedido.`} 
                            target="_blank" 
                            className="bg-green-600 text-white py-1.5 px-2 rounded text-center font-bold flex items-center justify-center gap-1">
                            💬 WhatsApp
                          </a>
                          <a 
                            href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address + ', Catuna, La Rioja')}`} 
                            target="_blank" 
                            className="bg-blue-600 text-white py-1.5 px-2 rounded text-center font-bold flex items-center justify-center gap-1">
                            📍 Google Maps
                          </a>
                        </div>

                        {o.status === 'pendiente' && (
                          <button onClick={()=>handleAcceptOrder(o.id)} className="w-full bg-green-700 text-white py-2 rounded font-bold shadow mt-2">
                            Aceptar Viaje (-${APP_FEE} comisión app)
                          </button>
                        )}

                        {o.status === 'en_camino' && (
                          <button onClick={()=>handleCompleteOrder(o.id)} className="w-full bg-orange-500 text-white py-2 rounded font-bold mt-2">
                            Marcar Entregado
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* 4. VISTA ADMIN (PROTEGIDA) */}
            {currentTab === 'admin' && (
              <div className="space-y-4 text-xs">
                {!isAdminLogged ? (
                  <form onSubmit={handleAdminLogin} className="border p-4 rounded bg-gray-50 space-y-3">
                    <h2 className="font-bold text-sm text-gray-800">Acceso Administrador</h2>
                    <input required type="password" placeholder="Contraseña Admin" value={adminPass} onChange={e=>setAdminPass(e.target.value)} className="w-full p-2 border rounded" />
                    <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded font-bold">Entrar</button>
                  </form>
                ) : (
                  <div className="space-y-5">
                    <div className="flex justify-between items-center bg-gray-800 text-white p-2 rounded">
                      <span className="font-bold">Panel Administrador</span>
                      <button onClick={()=>setIsAdminLogged(false)} className="text-red-300 font-bold underline">Salir</button>
                    </div>

                    {/* CONTROL DE COMISIONES POR COMERCIO (10%) */}
                    <div className="border p-3 rounded bg-orange-50 border-orange-200 space-y-2">
                      <h3 className="font-bold text-orange-900 text-sm">📊 Rendición de Comisiones (10%)</h3>
                      {stores.length === 0 ? <p className="text-gray-500">No hay comercios cargados.</p> : null}
                      {stores.map(store => {
                        const storeOrders = orders.filter(o => o.storeId === store.id && o.status === 'entregado' && !o.storeSettled);
                        const totalSales = storeOrders.reduce((sum, o) => sum + o.subtotal, 0);
                        const commissionDue = totalSales * STORE_COMMISSION_PERCENT;

                        return (
                          <div key={store.id} className="bg-white p-2.5 rounded border flex justify-between items-center">
                            <div>
                              <p className="font-bold text-gray-800">{store.name}</p>
                              <p className="text-gray-600">Ventas Pendientes: <strong>${totalSales}</strong></p>
                              <p className="text-orange-700 font-bold">Comisión 10%: ${commissionDue}</p>
                            </div>
                            <button 
                              onClick={()=>handleResetStoreCommission(store.id)}
                              disabled={commissionDue === 0}
                              className={`px-2.5 py-1.5 rounded font-bold text-white ${commissionDue > 0 ? 'bg-orange-600' : 'bg-gray-300'}`}>
                              Cobrado
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    {/* Acreditar Saldo a Cadete */}
                    <form onSubmit={handleRechargeBalance} className="border p-3 rounded bg-green-50 border-green-200 space-y-2">
                      <h3 className="font-bold text-green-900">💵 Acreditar Saldo a Cadete</h3>
                      <select required value={selectedCadeteId} onChange={e=>setSelectedCadeteId(e.target.value)} className="w-full p-2 border rounded bg-white">
                        <option value="">Selecciona un cadete...</option>
                        {cadetes.map(c => <option key={c.id} value={c.id}>{c.name} (Saldo actual: ${c.balance})</option>)}
                      </select>
                      <input required type="number" placeholder="Monto a recargar ($)" value={rechargeAmount} onChange={e=>setRechargeAmount(e.target.value)} className="w-full p-2 border rounded" />
                      <button type="submit" className="w-full bg-green-700 text-white py-2 rounded font-bold">Cargar Saldo</button>
                    </form>

                    {/* Crear Cadete (teléfono cambiado a text libre) */}
                    <form onSubmit={handleCreateCadete} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Registrar Nuevo Cadete</h3>
                      <input required placeholder="Nombre completo" value={newCadeteName} onChange={e=>setNewCadeteName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="Teléfono WhatsApp (Ej: 3826123456)" value={newCadetePhone} onChange={e=>setNewCadetePhone(e.target.value)} className="w-full p-2 border rounded" />
                      <select value={newCadeteVehicle} onChange={e=>setNewCadeteVehicle(e.target.value)} className="w-full p-2 border rounded bg-white">
                        <option value="Moto">Moto</option>
                        <option value="Bicicleta">Bicicleta</option>
                        <option value="Auto">Auto</option>
                      </select>
                      <div className="grid grid-cols-2 gap-2">
                        <input required placeholder="Usuario" value={newCadeteUser} onChange={e=>setNewCadeteUser(e.target.value)} className="w-full p-2 border rounded" />
                        <input required placeholder="Contraseña" value={newCadetePass} onChange={e=>setNewCadetePass(e.target.value)} className="w-full p-2 border rounded" />
                      </div>
                      <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">Crear Cadete</button>
                    </form>

                    {/* Crear Comercio con Datos Bancarios (teléfono cambiado a text libre) */}
                    <form onSubmit={handleCreateStore} className="border p-3 rounded bg-gray-50 space-y-2">
                      <h3 className="font-bold text-gray-800">Registrar Nuevo Comercio (con datos de pago)</h3>
                      <input required placeholder="Nombre del Negocio" value={newStoreName} onChange={e=>setNewStoreName(e.target.value)} className="w-full p-2 border rounded" />
                      <input required placeholder="Dirección del Local" value={newStoreAddress} onChange={e=>setNewStoreAddress(e.target.value)} className="w-full p-2 border rounded" />
                      <input required type="text" placeholder="WhatsApp del local (Ej: 3826123456)" value={newStorePhone} onChange={e=>setNewStorePhone(e.target.value)} className="w-full p-2 border rounded" />
                      <input placeholder="Alias de Mercado Pago del Local" value={newStoreAlias} onChange={e=>setNewStoreAlias(e.target.value)} className="w-full p-2 border rounded font-mono" />
                      <input placeholder="Nombre del Titular de la cuenta" value={newStoreTitular} onChange={e=>setNewStoreTitular(e.target.value)} className="w-full p-2 border rounded" />
                      <input required placeholder="Horario (Ej: 20:00 a 00:00 hs)" value={newStoreHours} onChange={e=>newStoreHours(e.target.value)} className="w-full p-2 border rounded" />
                      <div className="grid grid-cols-2 gap-2">
                        <input required placeholder="Usuario" value={newStoreUser} onChange={e=>newStoreUser(e.target.value)} className="w-full p-2 border rounded" />
                        <input required placeholder="Contraseña" value={newStorePass} onChange={e=>newStorePass(e.target.value)} className="w-full p-2 border rounded" />
                      </div>
                      <button type="submit" className="w-full bg-gray-700 text-white py-2 rounded font-bold">Crear Comercio</button>
                    </form>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
